# docker-compose.bench.yml — bench-throughput.sh only (NOT used by the soak suite).
#
# The bench measures the append pipeline (rate / latency / decode errors) against
# the fake HFT broker. Readiness gating on the NTP clock check is incidental to
# that measurement: this host currently measures ~120-190ms offset vs the
# configured NTP servers (three independent servers agree), which is real clock
# skew, not jitter, and would keep the container permanently unhealthy with the
# default 100ms limit. 500ms keeps a genuine guard while letting the bench run.
#
# Override at run time: BENCH_CLOCK_OFFSET_LIMIT_MS=... ./bench-throughput.sh
services:
  ingestion:
    environment:
      CLOCK_OFFSET_LIMIT_MS: ${BENCH_CLOCK_OFFSET_LIMIT_MS:-500}
      # The bench gates on evidence it reads from the journal WHILE the run is
      # live (subscription ack, then per-window errors), but P1-278 made the
      # JSON_FILE appender buffered (256KiB, flush only on rollover/exit) — so
      # the file stays 0 bytes for the whole run and every gate reads nothing.
      # Bench-only: the soak path keeps buffering (its hot path wants it).
      LOG_IMMEDIATE_FLUSH: "true"
      LOG_BUFFERED_IO: "false"
