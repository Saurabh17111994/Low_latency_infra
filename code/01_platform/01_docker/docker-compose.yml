# =============================================================================
# Docker Compose — Trading_project platform runtime (Phase 4.2 MVP topology)
#
# DEV-ONLY configuration (tracker 14 P9 box: explicitly marked). This file is
# for the local/single-host dev stack only: secrets come from .env (never
# committed), Fluss advertised listeners are compose-DNS names, checkpoints
# use the flink-checkpoints dev volume (NOT durable cross-VM storage — P4.2
# requires s3:// URIs in production), and the JM/TM reporter port mappings are
# dev-only. Production v1 (4 VMs Manager+Worker) and v2 (7 VMs Manager ONLY + Workers) live in docs/08_implementation/09-production-swarm.md; Swarm stack is code/01_platform/01_docker/docker-stack.yml (Option B single branch).
#
# Services: fluss (coordinator + tablet), flink (jobmanager + taskmanager),
# ingestion, compute, executor, otel-collector, openobserve.
#
# Direct Arrow Trade integration — no intermediate OpenAlgo or Kite layer.
# Secrets are NOT committed; copy .env.example to .env and fill values locally.
# EXECUTION_ENABLED must remain false in .env.example.
# =============================================================================

# Operational live manifest (1,024 instruments, Jul 31) — 1024 tokens/connection
# cap stays the per-connection contract (ARROW_HFT_MAX_TOKENS_PER_CONNECTION) —
# T0 3-slot ready. Default N=1 (1024) via ARROW_HFT_CONNECTIONS=1. Premium N=3
# shards a single 3000-row CSV as 1024+1024+952 without code rewrite — set
# ARROW_HFT_CONNECTIONS=3 (auto-sharded by BuildSubscriptionPlan at
# INSTRUMENT_MANIFEST_PATH). The single-manifest anchor below remains the
# N=1 default; the directory mount in the ingestion service exposes all host
# manifests for N=3. (A per-slot CSV list env — the plural form of
# ARROW_INSTRUMENT_MANIFEST — was an unbuilt T1 alternative; removed
# 2026-09-09, P5-012: no reader ever existed and the auto-shard path
# supersedes it.)
# Host paths are env-driven with defaults to the approved 1024 CSV/dir.
x-manifest: &manifest "${INSTRUMENT_MANIFEST_HOST_PATH:-/home/saurabh/Jupyter_notebook/Flink_Fluss_Infrastructure/Arrow_broker/instruments/cash_stocks/NSE_CM_EQUITY (1024).csv}"
x-manifest-dir: &manifest-dir "${INSTRUMENT_MANIFESTS_HOST_DIR:-/home/saurabh/Jupyter_notebook/Flink_Fluss_Infrastructure/Arrow_broker/instruments/cash_stocks}"

x-fluss-common: &fluss-common
  restart: unless-stopped
  networks: [trading-net]
  environment:
    FLUSS_BOOTSTRAP: fluss-coordinator:9123
    FLUSS_COORDINATOR_HOST: fluss-coordinator
    FLUSS_TABLET_HOST: fluss-tablet

x-flink-common: &flink-common
  restart: unless-stopped
  networks: [trading-net]
  depends_on: [fluss-coordinator]
  # NOTE: this environment map carries its own anchor (&flink-common-env).
  # A service that needs extra env vars MUST merge it explicitly with
  # `<<: *flink-common-env` — a bare `environment:` at the service level
  # REPLACES this whole map (observed 2026-08-30: TM lost FLINK_PROPERTIES
  # → tried to reach the ResourceManager at its own address and never
  # registered; also lost TASK_MANAGER_MEMORY_MANAGED_SIZE → 512M heap).
  environment: &flink-common-env
    # Lake tiering service (Flink job): S3A credentials for R2 via env only
    # (same contract as fluss-coordinator — never in FLUSS_PROPERTIES).
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID for lake tiering}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY for lake tiering}
    # Restore-only default (2026-08-28, #3 hardening): normal launches must
    # carry STATE_RECOVERY_PATH and restore. A missing restore path fails
    # closed at startup ([F005]) unless the operator deliberately overrides
    # with COMPUTE_ALLOW_REPLAY=1 (first-ever deploy) or ALLOW_FULL_REPLAY=true
    # at launch (documented break-glass — see docs/08_implementation/04-signal-job.md).
    ALLOW_FULL_REPLAY: "false"
    # G4 Durability T9: checkpoint storage contract
    # - Dev (default): keeps local durable volume via flink-checkpoints:/checkpoints
    #   (CHECKPOINT_DIR=file:///checkpoints via CheckpointingOptions.CHECKPOINTS_DIRECTORY;
    #   no S3 required — SignalJobConfig defaults to file:// when DEPLOYMENT_ENV=dev)
    # - Prod: requires encrypted S3 (CHECKPOINT_DIR=s3:// or s3a://, bucket AES256)
    #   — SignalJobConfig fails fast if CHECKPOINT_DIR missing or non-S3 when
    #   DEPLOYMENT_ENV=production or PROFILE=prod (G4 T9). Override at runtime:
    #   DEPLOYMENT_ENV=production CHECKPOINT_DIR=s3://bucket/flink-checkpoints ...
    DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-dev}
    CHECKPOINT_DIR: ${CHECKPOINT_DIR:-file:///checkpoints}
    SAVEPOINT_DIR: ${SAVEPOINT_DIR:-}
    # PROFILE alias for prod (task G4 T9: validate s3:// when PROFILE=prod or similar)
    PROFILE: ${PROFILE:-}
    # Streaming-3000 T3 G3 Compute (p=8, 16 Fluss buckets → 8 slots, hash(token) 2:1)
    # Dev single-host keeps 10 TaskSlots (was 8) — signal-job p=8 holds 8, the
    # extra 2 host the slot-scoped babysitter + SafetyHaltJob (both pinned
    # p=1). Scale target 3000 instruments @50k tps avg (1024 tokens/slot at 8).
    # Override with explicit env for tests (PARALLELISM=1).
    PARALLELISM: ${PARALLELISM:-8}
    STATE_BACKEND: ${STATE_BACKEND:-rocksdb}
    STATE_BACKEND_LOCAL_DIRS: ${STATE_BACKEND_LOCAL_DIRS:-/tmp/flink-rocksdb}
    STATE_BACKEND_MANAGED_MEMORY: ${STATE_BACKEND_MANAGED_MEMORY:-true}
    TASK_MANAGER_NETWORK_MEMORY_MAX: ${TASK_MANAGER_NETWORK_MEMORY_MAX:-256m}
    # CHG-120 (2026-09-01): NOTE — this env is a SignalJobConfig passthrough
    # for EMBEDDED/LOCAL runs only (job-level taskmanager.memory.managed.size);
    # in cluster mode it does NOT resize the TM's RocksDB pool, which is
    # derived at TM startup from taskmanager.memory.managed.fraction (see the
    # flink-conf block). Kept in sync with the cluster fraction: 4g matches
    # 0.6 of the 7g TM process. Evidence:
    # docs/Investigations_and_Reports/2026-09-01-throughput-degradation.md.
    TASK_MANAGER_MEMORY_MANAGED_SIZE: ${TASK_MANAGER_MEMORY_MANAGED_SIZE:-4g}
    # FLINK_PROPERTIES below feeds the image docker-entrypoint's
    # process_flink_properties, which does NOT skip '#' lines — every line
    # in the block becomes a Flink config property. Comment lines therefore
    # become garbage dotted keys, and two garbage keys whose nested paths
    # collide abort config.yaml generation with ClassCastException (String
    # cannot be cast to Map, observed as a JM/TM crash-loop 2026-09-02 when
    # new property keys shifted the collision). ALL comments live HERE,
    # above the block; the block itself is property lines ONLY:
    # - P8 (tracker 14): distributed-safe metrics via PrometheusReporter —
    #   /metrics on :9249 inside each container; the otel-collector scrapes
    #   flink-jobmanager:9249 + flink-taskmanager:9249 and remote-writes to
    #   OpenObserve. flink-metrics-prometheus ships in the image under
    #   /opt/flink/plugins/metrics-prometheus and is auto-loaded by
    #   PluginManager — no lib copy needed.
    # - P7 (tracker 14): metrics.latency.interval 1s (was 5s) for 5x better
    #   p99 sample density at low real-feed rates (histogram capacity 1024
    #   samples; 1s -> 60 markers/min, fills ~17min).
    # - taskmanager.numberOfTaskSlots: 10 -> 16 (C2 20k bottleneck
    #   2026-09-02): job p8 -> p16; fingerprint-dedup is the RocksDB-bound
    #   hot operator at ~75% per-subtask occupancy (74-77%) at 20,480 t/s.
    #   TM memory unchanged (slots share the task heap; RocksDB native
    #   memory is the managed pool, not per-slot).
    # - P9 (tracker 14 box 1007): explicit JM/TM memory envelopes. JM 1600m
    #   = heap 1024m (SIGNAL-warn-jvm-heap-high cap) + off-heap 128m +
    #   metaspace 256m + jvm-overhead 192m.
    # - CHG-120 (2026-09-01): TM 6g -> 7g alongside managed 2g -> 4g;
    #   managed fraction 0.4 -> 0.6 for RocksDB headroom (at 0.4 the ~80
    #   RocksDB instances got ~25 MB each and fingerprint-dedup ~2.3 ms
    #   busy/rec capped the pipeline at ~1.7k/s — stage-capture
    #   logs/tracker-14/stage-capture-20260901-224849; 0.6 of 7g ->
    #   ~3.2 GB managed, ~40 MB/instance, task heap ~2.1 GB).
    # - 2026-09-04 (soak OOM hunt): 0.6 -> 0.5. The 0.6 fraction left the
    #   JVM heap at only 1.545 GB (observed -Xmx1658930959), which OOM'd
    #   under the 48k/s soak (~21:58:42 OutOfMemoryError -> prometheus-http
    #   thread died -> prom endpoint dead while REST stayed healthy).
    #   0.5 of 7g -> ~3.14 GB managed (still > CHG-120's ~40 MB/instance
    #   target), heap ~2.16 GB. RocksDB actual RSS was ~1 GB — the 0.6
    #   allowance was never used.
    # - P7 phase-1+ (tracker 14): explicit task off-heap (direct) budget —
    #   the 1.7 GB RocksDB restore streams state-handle downloads through
    #   direct buffers; 512m covers the concurrent 8-subtask restore.
    # - Streaming-3000 T3 G3: RocksDB incremental on SSD, network 256m
    #   (tested 512m under 10Hz full load: no throughput effect — network
    #   buffers ruled out, the cap is RocksDB/compaction churn).
    # - C2 20k bottleneck (2026-09-02): RocksDB write-path knobs for the
    #   dedup hot operator (writebuffer.count 4 / memory.write-buffer-ratio
    #   0.6 / threads.write 2 — every tick = 1 Get + 1 Put on a ~13MB-per-DB
    #   TTL set at ~2,560 rec/s/subtask at peak; fewer larger flushes, less
    #   compaction stall) are passed as JOB-LEVEL -D flags in
    #   pipeline-lib.sh (pipeline_submit_job), NOT here: adding
    #   state.backend.rocksdb.* keys to this block collides with the
    #   `state.backend` String leaf in YamlParserUtils
    #   convertAndDumpYamlFromFlatMap and crash-loops the TM (observed
    #   2026-09-02). The `state.backend: rocksdb` LEAF is therefore NOT in
    #   the block: it prefix-collides with state.backend.rocksdb.localdir /
    #   state.backend.incremental and one side silently loses (HashMap-order
    #   dependent — observed 2026-09-02: localdir+incremental dropped from
    #   the generated config.yaml). The signal job pins backend + localdir +
    #   incremental at JOB level (STATE_BACKEND env -> SignalJobConfig ->
    #   applyRuntimeOptions), so the TM-level leaf was redundant for it.
    #   NOTE: any OTHER job relying on the TM-level default now gets Flink's
    #   default backend (hashmap) — pin your backend at job level. Guarded
    #   by G22 (check_flink_properties.py) + the pipeline preflight.
    # - The image default env.java.opts.all already includes
    #   --add-opens=java.base/java.nio=ALL-UNNAMED (arrow-compatible JVM
    #   options) — do NOT set env.java.opts here: it collides with the
    #   nested env.java.opts.all key in YamlParserUtils and aborts startup.
    # RocksDB full metric set (2026-09-02 decline hunt): Flink's defaults
    # expose only block_cache/memtable/readers-mem. The toggles below add the
    # compaction + flush + SST growth story so OpenObserve can correlate
    # per-record cost inflation with compaction activity. Observability-only:
    # no data-path semantics change. Write LATENCY histograms are NOT
    # exposeable by Flink at all (checked 2026-09-02) — compaction/flush/
    # SST-size + host iostat await are the indirect latency evidence.
    # (Comment must live OUTSIDE the FLINK_PROPERTIES block — G22b.)
    # Values in the block must stay UNQUOTED: the entrypoint's
    # process_flink_properties splits on the first ':' and keeps the rest
    # VERBATIM, so a YAML-quoted "true" lands in config.yaml as the 6-char
    # string '"true"' (literal quotes) -> Flink's boolean parse fails with
    # "Could not parse value '\"true\"' for key '...'" and RocksDB jobs die at
    # JobMaster init (observed 2026-09-04; guarded by check_flink_properties.py).
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      rest.address: flink-jobmanager
      rest.bind-address: 0.0.0.0
      metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      metrics.reporter.prom.port: 9249
      metrics.reporter.prom.interval: 2 SECONDS
      metrics.latency.interval: 1000
      taskmanager.numberOfTaskSlots: 16
      jobmanager.memory.process.size: 1600m
      taskmanager.memory.process.size: 7g
      taskmanager.memory.task.off-heap.size: 512m
      taskmanager.memory.managed.fraction: 0.5
      taskmanager.memory.network.max: ${TASK_MANAGER_NETWORK_MEMORY_MAX:-256m}
      taskmanager.memory.network.min: ${TASK_MANAGER_NETWORK_MEMORY_MIN:-256m}
      state.backend.incremental: true
      state.backend.rocksdb.localdir: /tmp/flink-rocksdb
      state.backend.rocksdb.metrics.num-running-compactions: true
      state.backend.rocksdb.metrics.compaction-pending: true
      state.backend.rocksdb.metrics.num-running-flushes: true
      state.backend.rocksdb.metrics.estimate-num-keys: true
      state.backend.rocksdb.metrics.total-sst-files-size: true
      state.backend.rocksdb.metrics.estimate-live-data-size: true
      state.backend.rocksdb.metrics.size-all-mem-tables: true
      state.backend.rocksdb.metrics.num-entries-active-mem-table: true
      state.backend.rocksdb.metrics.num-immutable-mem-table: true
      state.backend.rocksdb.metrics.estimate-pending-compaction-bytes: true
      state.backend.rocksdb.metrics.num-live-versions: true
      state.backend.rocksdb.metrics.cur-size-active-mem-table: true
      state.backend.rocksdb.metrics.num-entries-immutable-mem-table: true
      state.backend.rocksdb.metrics.block-cache-pinned-usage: true
    DEDUP_TTL_MS: "60000"
    CANDLE_WINDOW_MS: "15000"
    CHECKPOINT_INTERVAL_MS: "10000"
    CHECKPOINT_TIMEOUT_MS: "30000"
    MAX_CONCURRENT_CHECKPOINTS: "1"
    RESTART_MAX_ATTEMPTS: "3"
    RESTART_DELAY_MS: "30000"
    FLUSS_BOOTSTRAP: fluss-coordinator:9123
    # Signal job Fluss wiring (prod wiring for Position_State handshake,
    # Option B max-one-active): explicit bootstrap alias + database + Position_State
    # table. SignalJobConfig accepts either FLUSS_BOOTSTRAP_SERVERS or the
    # compose alias FLUSS_BOOTSTRAP; setting both keeps the contract explicit
    # and lets `docker compose config` show the resolved value. POSITION_STATE_TABLE
    # defaults to Position_State (DDL 29) — explicit here so Swarm parity is
    # visible and DDL drift is caught at `docker compose config` time.
    FLUSS_BOOTSTRAP_SERVERS: ${FLUSS_BOOTSTRAP_SERVERS:-${FLUSS_BOOTSTRAP:-fluss-coordinator:9123}}
    FLUSS_DATABASE: ${FLUSS_DATABASE:-default}
    POSITION_STATE_TABLE: ${POSITION_STATE_TABLE:-Position_State}
    # SafetyHaltJob reads SAFETY_MANIFEST_TOKENS via System.getenv in the
    # JobManager JVM (the /jars/run main() runs there) — it must be on the
    # flink-common anchor, not just the compute service. Dev default: empty →
    # submit-jobs.sh skips the safety consumer; production MUST set it.
    SAFETY_MANIFEST_TOKENS: ${SAFETY_MANIFEST_TOKENS:-}
    # P2-079: SignalJob's F005 gate reads STATE_RECOVERY_PATH via
    # System.getenv in the JobManager JVM — the REST savepointPath the
    # launcher forwards is invisible to the job's own config, so a production
    # restore run failed closed at [F005] ("STATE_RECOVERY_PATH is required")
    # despite a valid savepoint. Same value on the anchor keeps the launcher
    # gate and the job's gate consistent. No default: unset stays unset.
    STATE_RECOVERY_PATH: ${STATE_RECOVERY_PATH:-}

networks:
  trading-net:
    driver: bridge
  # T3: execution traffic is private to the gateway/Nautilus/bridge boundary.
  # This profile is disabled from the default local stack until T8 wires the
  # gateway and Rust service; the network policy is still resolved and tested.
  execution-net:
    driver: bridge
    internal: true
  # T3: only execution-bridge may join the Arrow order-path egress network.
  # The real sandbox endpoint is intentionally not configured by this phase.
  arrow-egress:
    driver: bridge

volumes:
  # 2026-09-05: the Fluss catalog (ZooKeeper) must survive compose down —
  # without it the tablet data volumes orphan on restart (see zookeeper svc).
  zookeeper-data:
  zookeeper-datalog:
  fluss-data:
  # P3.2: lake-snapshot offsets files must be readable by whichever server
  # serves the getLakeSnapshot RPC (coordinator OR tablet) — keep them on a
  # shared volume, not per-container /tmp.
  fluss-remote-data:
  # P3.2: tablet /tmp/fluss/data (log segments + KV state) must survive
  # container recreation (previous recreation lost dev data).
  fluss-tablet-data:
  flink-checkpoints:
  # CHG-120 (2026-09-01): RocksDB operator-state volume — the TM's
  # state.backend.rocksdb.localdir (/tmp/flink-rocksdb) had no volume, so
  # every state put/delete paid container-overlayfs I/O (~0.5-1ms per op
  # vs ~5-20us on a volume). JFR profile showed task threads 100% inside
  # org.rocksdb.RocksDB.put with system-CPU only, capping the pipeline at
  # ~4k records/s and degrading checkpoints to expiry under load. Mounting
  # this volume at the exact localdir path fixes it with zero other config.
  flink-rocksdb:
  # P8.2 (tracker 14): flink_logs stream — JobManager/TaskManager file logs
  # land here and are read by the collector's filelog receiver.
  flink-logs:
  # P8.1 (tracker 14 box 827): fluss_logs stream — CoordinatorServer /
  # TabletServer logs (/opt/fluss/log/fluss--*.log) land here and are read by
  # the collector's filelog/fluss receiver.
  fluss-logs:
  openobserve-data:
  # R-171: persistent ingestion JSON logs.
  ingestion-logs:
  # 2026-08-22 single-pane: infra logs (host/journald) for O2.
  infra-logs:
  # P3.2 R2 lake dev — S3-compatible MinIO for E2E lake tiering (http://minio:9000)
  minio-data:
  # G6 alert routing — durable O2 alert delivery history (alert-consumer).
  alert-store:

services:
  # ---- ZooKeeper: metadata store for Fluss -----------------------------
  zookeeper:
    restart: always
    image: zookeeper:3.9.2
    networks: [trading-net]
    ports: ["2181:2181"]
    # 2026-09-05: ZK holds the Fluss CATALOG (table list + schemas). It had
    # no named volume, so compose down deleted the catalog while the tablet
    # data volumes survived — next up orphaned every table dir (soak
    # preflight "fluss not ready", 2026-09-05). Keep both persistent.
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog

  # ---- Fluss: streaming bus + storage + lake tier -------------------------
  fluss-coordinator:
    <<: *fluss-common
    image: ${FLUSS_IMAGE:?set FLUSS_IMAGE to an immutable digest}
    env_file:
      - .env
      - secrets.env

    command: ["coordinatorServer"]
    depends_on: [zookeeper]
    ports: ["9123:9123"]
    volumes:
      - fluss-data:/data
      - fluss-remote-data:/tmp/fluss/remote-data
      # P8.1 (tracker 14 box 827): fluss_logs stream — server logs volume.
      - fluss-logs:/opt/fluss/log
      # P3.2 lake tiering: the iceberg plugin classloader needs hadoop-aws/S3A
      # (fluss-fs-s3) AND hadoop-hdfs HdfsConfiguration (fluss-fs-hdfs) — the
      # image ships both in their own plugin dirs; bind-mount them into the
      # iceberg plugin dir (docs: "add other jars required by datalake to
      # plugins/<fmt>/").
      - ./fluss-plugins/iceberg/fluss-fs-s3-0.9.1-incubating.jar:/opt/fluss/plugins/iceberg/fluss-fs-s3-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-fs-hdfs-0.9.1-incubating.jar:/opt/fluss/plugins/iceberg/fluss-fs-hdfs-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-fs-hadoop-shaded-0.9-SNAPSHOT.jar:/opt/fluss/plugins/iceberg/fluss-fs-hadoop-shaded-0.9-SNAPSHOT.jar:ro
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      FLUSS_COORDINATOR_HOST: fluss-coordinator
      FLUSS_TABLET_HOST: fluss-tablet
      # S3A credentials via env only (never in FLUSS_PROPERTIES — see below).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID for lake tiering}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY for lake tiering}
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper:2181
        bind.listeners: INTERNAL://fluss-coordinator:0,CLIENT://fluss-coordinator:9123
        # P8: advertise the compose service name, not localhost — in-docker
        # clients (Flink cluster, collector-adjacent tools) resolve it via the
        # compose DNS. Host clients keep working via /etc/hosts aliases
        # (127.0.0.1 fluss-coordinator fluss-tablet) + the host port mappings.
        advertised.listeners: CLIENT://fluss-coordinator:9123
        internal.listener.name: INTERNAL
        remote.data.dir: /tmp/fluss/remote-data
        # Lake tiering (tracker 14 P3.2): datalake.* is the server-side lakehouse
        # config; datalake.iceberg.* becomes the Iceberg catalog properties and
        # iceberg.hadoop.* the Hadoop fs.s3a.* config (R2). Credentials arrive
        # ONLY via .env interpolation — never hardcoded; missing values fail
        # closed at `docker compose up`.
        datalake.format: ${DATALAKE_FORMAT:-iceberg}
        datalake.iceberg.type: hadoop
        datalake.iceberg.warehouse: ${S3_WAREHOUSE_PATH:?set S3_WAREHOUSE_PATH for lake tiering}
        # Hadoop fs.s3a.* keys must carry the datalake.iceberg. prefix too:
        # extractLakeProperties strips datalake.<format>. before HadoopUtils
        # scans for the iceberg.hadoop. prefix.
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint: ${R2_ENDPOINT:?set R2_ENDPOINT for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint.region: ${AWS_REGION:-auto}
        datalake.iceberg.iceberg.hadoop.fs.s3a.path.style.access: "true"
        # fluss-fs-s3's hadoop FileSystem service file registers only s3native —
        # pin S3A explicitly or FileSystem.get fails with "No FileSystem for
        # scheme s3".
        datalake.iceberg.iceberg.hadoop.fs.s3.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        # R2 stall containment (2026-08-12): a wedged R2 socket must fail the
        # lake reader fast, not hang forever (plan Phase 3). In hadoop-aws
        # 3.3.x fs.s3a.connection.timeout maps to the SDK SOCKET read timeout
        # (S3A default 200000 ms) and fs.s3a.connection.establish.timeout to
        # the TCP connect timeout (default 50000 ms); fs.s3a.socket.timeout is
        # NOT read by S3AUtils.initConnectionSettings and must not be set.
        # Values are unquoted integers: S3AUtils.intOption parses them and a
        # quoted string raises NumberFormatException on first S3 access.
        # Match the batch job's CANDLE_MIGRATION_S3_*_TIMEOUT_MS env defaults.
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.timeout: 30000
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.establish.timeout: 30000
        # Credentials NOT set here: GlobalConfiguration logs every property value
        # at INFO, so fs.s3a.access.key/secret.key would leak into docker logs.
        # S3A's default provider chain (EnvironmentVariableCredentialsProvider)
        # reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the container env.

  fluss-tablet:
    <<: *fluss-common
    image: ${FLUSS_IMAGE:?set FLUSS_IMAGE to an immutable digest}
    env_file:
      - .env
      - secrets.env

    command: ["tabletServer"]
    # T13 chaos-03: tablet must auto-restart after SIGKILL (kill→recovery invariant)
    restart: unless-stopped
    depends_on: [fluss-coordinator]
    ports: ["9124:9124"]
    volumes:
      - fluss-data:/data
      # P3.2: shared lake-snapshot dir — the tablet also serves getLakeSnapshot.
      - fluss-remote-data:/tmp/fluss/remote-data
      # P3.2: tablet log data must survive container recreation.
      - fluss-tablet-data:/tmp/fluss/data
      # P8.1 (tracker 14 box 827): fluss_logs stream — server logs volume.
      - fluss-logs:/opt/fluss/log
      # P3.2 lake tiering — same S3A + hdfs plugin overlay as the coordinator.
      - ./fluss-plugins/iceberg/fluss-fs-s3-0.9.1-incubating.jar:/opt/fluss/plugins/iceberg/fluss-fs-s3-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-fs-hdfs-0.9.1-incubating.jar:/opt/fluss/plugins/iceberg/fluss-fs-hdfs-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-fs-hadoop-shaded-0.9-SNAPSHOT.jar:/opt/fluss/plugins/iceberg/fluss-fs-hadoop-shaded-0.9-SNAPSHOT.jar:ro
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      FLUSS_COORDINATOR_HOST: fluss-coordinator
      FLUSS_TABLET_HOST: fluss-tablet
      # Tablet JFR diagnostic (2026-09-02, temporary): the TM JFR proved
      # operators park waiting for fetch results, moving the investigation
      # boundary to the Fluss read path. tablet-server.sh appends
      # FLUSS_ENV_JAVA_OPTS_TS to the JVM line. Instrumentation only —
      # remove after the read-path diagnosis run.
      FLUSS_ENV_JAVA_OPTS_TS: >-
        -XX:StartFlightRecording=settings=profile,duration=900s,filename=/opt/fluss/log/tablet-diag.jfr,maxsize=1g
      # S3A credentials via env only (never in FLUSS_PROPERTIES — see below).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID for lake tiering}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY for lake tiering}
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper:2181
        bind.listeners: INTERNAL://fluss-tablet:0, CLIENT://fluss-tablet:9124
        # P8: advertise fluss-tablet:9124 (service name + host-mapped port) so
        # in-docker Flink clients reach the tablet; host clients resolve the
        # name via /etc/hosts (127.0.0.1 fluss-tablet) and port 9124 mapping.
        advertised.listeners: CLIENT://fluss-tablet:9124
        internal.listener.name: INTERNAL
        tablet-server.id: 0
        kv.snapshot.interval: 0s
        data.dir: /tmp/fluss/data
        remote.data.dir: /tmp/fluss/remote-data
        # 2026-08-30 burst root cause (A2b v3): LogTieringTask copies rolled
        # segments to remote.data.dir — on this single-NVMe dev box that is
        # read+write on the SAME disk at 150-200 MB/s, saturating it and
        # bursting preview latency (~90s period; 35/42 burst-aligned across
        # 3 runs; tablet spikes 3/3 aligned in run 145108). 0 disables
        # remote-log tiering (Fluss source: RemoteLogManager.remoteDisabled).
        # Bench runs: FLUSS_REMOTE_LOG_TASK_INTERVAL=0s docker compose up -d
        # fluss-tablet. MUST be '0s', not '0' — duration type needs a unit or
        # the tablet fails to start (Could not parse value '0').
        # Lake/tiering tests keep the 1m default (minio up).
        remote.log.task-interval-duration: ${FLUSS_REMOTE_LOG_TASK_INTERVAL:-1m}
        # Lake tiering (tracker 14 P3.2) — same datalake.* block as the
        # coordinator: datalake.iceberg.* → Iceberg catalog props,
        # iceberg.hadoop.* → Hadoop fs.s3a.* (R2). Credentials only via .env.
        datalake.format: ${DATALAKE_FORMAT:-iceberg}
        datalake.iceberg.type: hadoop
        datalake.iceberg.warehouse: ${S3_WAREHOUSE_PATH:?set S3_WAREHOUSE_PATH for lake tiering}
        # Hadoop fs.s3a.* keys must carry the datalake.iceberg. prefix too:
        # extractLakeProperties strips datalake.<format>. before HadoopUtils
        # scans for the iceberg.hadoop. prefix.
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint: ${R2_ENDPOINT:?set R2_ENDPOINT for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint.region: ${AWS_REGION:-auto}
        datalake.iceberg.iceberg.hadoop.fs.s3a.path.style.access: "true"
        # fluss-fs-s3's hadoop FileSystem service file registers only s3native —
        # pin S3A explicitly or FileSystem.get fails with "No FileSystem for
        # scheme s3".
        datalake.iceberg.iceberg.hadoop.fs.s3.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        # R2 stall containment (2026-08-12): a wedged R2 socket must fail the
        # lake reader fast, not hang forever (plan Phase 3). In hadoop-aws
        # 3.3.x fs.s3a.connection.timeout maps to the SDK SOCKET read timeout
        # (S3A default 200000 ms) and fs.s3a.connection.establish.timeout to
        # the TCP connect timeout (default 50000 ms); fs.s3a.socket.timeout is
        # NOT read by S3AUtils.initConnectionSettings and must not be set.
        # Values are unquoted integers: S3AUtils.intOption parses them and a
        # quoted string raises NumberFormatException on first S3 access.
        # Match the batch job's CANDLE_MIGRATION_S3_*_TIMEOUT_MS env defaults.
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.timeout: 30000
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.establish.timeout: 30000
        # Credentials NOT set here: GlobalConfiguration logs every property value
        # at INFO, so fs.s3a.access.key/secret.key would leak into docker logs.
        # S3A's default provider chain (EnvironmentVariableCredentialsProvider)
        # reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the container env.

  # ---- Flink: compute (signal + babysitter jobs) ----------------------------
  flink-jobmanager:
    <<: *flink-common
    image: ${FLINK_IMAGE:?set FLINK_IMAGE to an immutable digest}
    # The image ships flink-metrics-prometheus under plugins/metrics-prometheus/
    # (auto-loaded by PluginManager) — no lib copy needed.
    command: ["jobmanager"]
    ports:
      - "8081:8081"
      # Host-side reporter port for verification (collector scrapes the
      # internal name flink-jobmanager:9249; this mapping is dev-only).
      - "9249:9249"
    volumes:
      - flink-checkpoints:/checkpoints
      - flink-logs:/opt/flink/log
      - ./flink-log4j-console.properties:/opt/flink/conf/log4j-console.properties:ro
      # Lake tiering service jars (Flink job classpath): fluss-flink-2.2 fat
      # connector (client + tiering builder + 2.2 adapter), fluss-flink-tiering
      # entrypoint, fluss-lake-iceberg plugin, and the s3a/hadoop trio the
      # fluss-coordinator already mounts under plugins/iceberg (P3.2).
      - ./fluss-plugins/iceberg/fluss-flink-2.2-0.9.1-incubating.jar:/opt/flink/lib/fluss-flink-2.2-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-flink-tiering-0.9.1-incubating.jar:/opt/flink/lib/fluss-flink-tiering-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-lake-iceberg-0.9.1-incubating.jar:/opt/flink/lib/fluss-lake-iceberg-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-fs-s3-0.9.1-incubating.jar:/opt/flink/lib/fluss-fs-s3-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-fs-hdfs-0.9.1-incubating.jar:/opt/flink/lib/fluss-fs-hdfs-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-fs-hadoop-shaded-0.9-SNAPSHOT.jar:/opt/flink/lib/fluss-fs-hadoop-shaded-0.9-SNAPSHOT.jar:ro
      # M-15/M-16 (2026-08-31): iceberg's shaded parwrite path lazily loads
      # org.apache.hadoop.mapreduce.lib.input.FileInputFormat; the class lives
      # only in hadoop-mapreduce-client-core. Do NOT mount the full
      # flink-shaded-hadoop-2-uber (2.8.3): its Configuration breaks fluss-fs-s3's
      # S3A (NoSuchMethodError getTimeDuration). This minimal jar carries ONLY
      # org/apache/hadoop/mapreduce/** — Configuration stays the 3.3.x one
      # bundled in fluss-fs-s3/fluss-fs-hadoop-shaded.
      - ./fluss-plugins/iceberg/hadoop-mapreduce-compat-2.8.5.jar:/opt/flink/lib/hadoop-mapreduce-compat-2.8.5.jar:ro

  flink-taskmanager:
    <<: *flink-common
    image: ${FLINK_IMAGE:?set FLINK_IMAGE to an immutable digest}
    command: ["taskmanager"]
    environment:
      # Merge the flink-common env map (see anchor note above) — do NOT let
      # this block replace it.
      <<: *flink-common-env
      # GC pause logging (2026-08-30): periodic ~90s latency bursts across
      # all operators were attributed to neither compute nor checkpoints;
      # GC pauses are the remaining hypothesis and were previously
      # unobservable (no GC logging). Unified JVM logging to a dedicated
      # file inside the mounted flink-logs volume; rotate at 50MB x 5.
      # The docker-entrypoint appends FLINK_ENV_JAVA_OPTS AFTER the memory
      # settings, so taskmanager.heap.size etc. stay intact.
      # WARNING: setting FLINK_ENV_JAVA_OPTS makes config.sh SKIP reading
      # env.java.opts.all from config.yaml (config.sh: "if [ -z FLINK_ENV_
      # JAVA_OPTS ]..."). The image default env.java.opts.all carries the
      # --add-opens=java.base/java.nio=ALL-UNNAMED that Fluss's Arrow
      # deserialization REQUIRES — omit it and every source subtask fails
      # with ExceptionInInitializerError: MemoryUtil (observed 2026-08-30,
      # job 966456a5). Therefore this value = image default env.java.opts.all
      # + GC/safepoint logging. If the image changes, re-sync with the
      # image's config.yaml env.java.opts.all.
      # JFR diagnostic (2026-09-02, temporary): appended to the folded
      # scalar BELOW — profile settings (10ms execution sampling,
      # ThreadPark/JavaMonitorBlocked/SocketRead/SocketWrite/alloc
      # sampling). Duration-bounded, auto-dumped to the flink-logs
      # volume. Instrumentation only — remove after diagnosis. NOTE:
      # comments cannot live inside the >- folded scalar (they become
      # part of the value and reach the JVM as a bogus arg).
      FLINK_ENV_JAVA_OPTS: >-
        --add-exports=java.rmi/sun.rmi.registry=ALL-UNNAMED
        --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
        --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED
        --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED
        --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
        --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
        --add-exports=java.security.jgss/sun.security.krb5=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.net=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
        --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
        --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
        --add-opens=java.base/java.text=ALL-UNNAMED
        --add-opens=java.base/java.time=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
        --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED
        --add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED
        -Xlog:gc*,safepoint:file=/opt/flink/log/gc.log:time,uptime,level,tags:filecount=5,filesize=50m
        -XX:StartFlightRecording=settings=profile,duration=900s,filename=/opt/flink/log/tm-diag.jfr,maxsize=1g
    # Run as root so the Fluss RemoteLogDownloader can create its download
    # cache under /tmp/fluss (docker creates the /tmp/fluss mount parent as
    # root; the image default user flink:flink gets AccessDeniedException —
    # observed 2026-08-29). The Flink entrypoint drops privileges for workers
    # where configured; dev-only compromise.
    user: "root"
    depends_on: [flink-jobmanager]
    ports:
      # Host-side reporter port for verification (container-internal 9249;
      # 9250 mapping is dev-only).
      - "9250:9249"
    volumes:
      - flink-checkpoints:/checkpoints
      - flink-logs:/opt/flink/log
      # CHG-120 (2026-09-01): RocksDB state volume at the exact
      # state.backend.rocksdb.localdir path — see the flink-rocksdb volume
      # declaration for the full rationale (overlayfs was capping the
      # pipeline at ~4k rec/s; JFR: task threads inside RocksDB.put only).
      - flink-rocksdb:/tmp/flink-rocksdb
      # Fluss remote-data must be shared with the tablet: raw_table_1 has
      # datalake tiering enabled, and the source's RemoteLogDownloader fetches
      # tiered log segments from remote.data.dir. Without this mount the TM
      # hits FileNotFoundException and the source stalls at read=0
      # (observed 2026-08-29: Shape B — job RUNNING, all operators read=0).
      - fluss-remote-data:/tmp/fluss/remote-data
      - ./flink-log4j-console.properties:/opt/flink/conf/log4j-console.properties:ro
      # Lake tiering service jars (Flink job classpath): fluss-flink-2.2 fat
      # connector (client + tiering builder + 2.2 adapter), fluss-flink-tiering
      # entrypoint, fluss-lake-iceberg plugin, and the s3a/hadoop trio the
      # fluss-coordinator already mounts under plugins/iceberg (P3.2).
      - ./fluss-plugins/iceberg/fluss-flink-2.2-0.9.1-incubating.jar:/opt/flink/lib/fluss-flink-2.2-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-flink-tiering-0.9.1-incubating.jar:/opt/flink/lib/fluss-flink-tiering-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-lake-iceberg-0.9.1-incubating.jar:/opt/flink/lib/fluss-lake-iceberg-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-fs-s3-0.9.1-incubating.jar:/opt/flink/lib/fluss-fs-s3-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-fs-hdfs-0.9.1-incubating.jar:/opt/flink/lib/fluss-fs-hdfs-0.9.1-incubating.jar:ro
      - ./fluss-plugins/iceberg/fluss-fs-hadoop-shaded-0.9-SNAPSHOT.jar:/opt/flink/lib/fluss-fs-hadoop-shaded-0.9-SNAPSHOT.jar:ro
      # M-15/M-16 (2026-08-31): iceberg's shaded parwrite path lazily loads
      # org.apache.hadoop.mapreduce.lib.input.FileInputFormat; the class lives
      # only in hadoop-mapreduce-client-core. Do NOT mount the full
      # flink-shaded-hadoop-2-uber (2.8.3): its Configuration breaks fluss-fs-s3's
      # S3A (NoSuchMethodError getTimeDuration). This minimal jar carries ONLY
      # org/apache/hadoop/mapreduce/** — Configuration stays the 3.3.x one
      # bundled in fluss-fs-s3/fluss-fs-hadoop-shaded.
      - ./fluss-plugins/iceberg/hadoop-mapreduce-compat-2.8.5.jar:/opt/flink/lib/hadoop-mapreduce-compat-2.8.5.jar:ro

  # ---- Services -----------------------------------------------------------
  #
  # PHASE 1: Fluss + ingestion are active.
  # All other services commented out — uncomment as each phase is built.

  ingestion:
    <<: *fluss-common
    build:
      # The Dockerfile COPYs the parent POM, the common module, and the
      # ingestion module, so the build context MUST be the Maven reactor
      # root (code/ = ../.. from 01_docker/), not the ingestion directory.
      context: ../..
      dockerfile: 02_services/01_ingestion/Dockerfile
    env_file:
      - .env
      - secrets.env

    # CHG-117 hygiene: bounded restart — the OTLP exporter fails fast when
    # otel-collector is not yet ready (distroless image has no healthcheck
    # probe), and `unless-stopped` turned that into an infinite crash loop
    # (22 restarts observed). on-failure:3 stops the churn; prod should also
    # gate on otel health via the OTLP endpoint.
    restart: on-failure:3
    depends_on: [fluss-coordinator, fluss-tablet, otel-collector]
    # 2026-09-12: explicit stop grace period. Docker's default is 10s, but
    # ingestion's shutdown sequence is deliberately allowed to take longer than
    # that (the uncertainty journal is persisted BEFORE the drain, and the
    # evidence writers each release under a bounded budget), so a SIGKILL at 10s
    # would land mid-sequence and discard pending safety-halt / quarantine /
    # discontinuity evidence. Worst case is the sum of the bounded steps:
    #   drain phase            ~2s   (DRAIN_DEADLINE_SECONDS, one shared budget)
    #   evidence writers       6s    (3 x BoundedClose 2s)
    #   metrics final flush   11s    (6s scheduler awaitTermination + 5s single-flight)
    #   main-thread join      10s    (SHUTDOWN_MAIN_JOIN_MS)
    #   late-bridge reap       3s
    #   ------------------------------------
    #   ~32s, so 40s leaves headroom. Healthy shutdowns take milliseconds; this
    #   bound only applies to a wedged cluster. Raising DRAIN_DEADLINE_SECONDS
    #   past its 2s default eats into the headroom — keep the sum under 40s
    #   (pinned by ShutdownBudgetGraceTest).
    stop_grace_period: 40s
    environment:
      # S3 (2026-08-29, decision A): secrets are delivered via env_file — the
      # SecretGuard skips its fail-closed check when this marker is present.
      SECRETS_VIA_ENV_FILE: "1"
      # P1-077: explicit env — the service refuses startup without it.
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-dev}
      # T6: proto is THE transport (CHG-115; NDJSON pipe removed 2026-08-29).
      # TRANSPORT=proto|grpc only; anything else is FATAL in the bridge.
      TRANSPORT: ${TRANSPORT:-proto}
      ARROW_APP_ID: ${ARROW_APP_ID}
      ARROW_APP_SECRET: ${ARROW_APP_SECRET}
      ARROW_USER_ID: ${ARROW_USER_ID}
      ARROW_PASSWORD: ${ARROW_PASSWORD}
      ARROW_TOTP_KEY: ${ARROW_TOTP_KEY}
      ARROW_INSTRUMENT_TOKENS: ${ARROW_INSTRUMENT_TOKENS:-}
      ARROW_DEBUG_WS: ${ARROW_DEBUG_WS:-}
      ARROW_TICK_COUNTS: ${ARROW_TICK_COUNTS:-}
      # ING-TCP-001: the bridge writes its final per-token tick-count report
      # to this file (survives the parent JVM closing the pipe streams at
      # shutdown — stderr-only reports die with SIGPIPE). Host path so the
      # reconcile can read it after the container stops.
      ARROW_TICK_COUNTS_FILE: ${ARROW_TICK_COUNTS_FILE:-/tmp/arrow-tick-counts.txt}
      ARROW_HFT_LATENCY_MS: ${ARROW_HFT_LATENCY_MS:-50}
      # T0 3-slot (streaming-3000): env-driven slot count N=1..3. Default 1
      # keeps single-socket 1024 working; N=3 shards a single CSV (3000 rows)
      # as 1024+1024+952 via BuildSubscriptionPlan contiguous chunks.
      # Go/Java both enforce 1..3 (hftRange/intRange).
      ARROW_HFT_CONNECTIONS: ${ARROW_HFT_CONNECTIONS:-1}
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      ALLOW_RUNTIME_DDL: ${ALLOW_RUNTIME_DDL:-false}
      # Single-manifest fallback — env-driven with default to the N=1 approved
      # 1024 CSV. Overridable via host env for 3000 single-CSV sharding.
      INSTRUMENT_MANIFEST_PATH: ${INSTRUMENT_MANIFEST_PATH:-/instruments/NSE_CM_EQUITY.csv}
      ARROW_INSTRUMENT_MANIFEST: ${ARROW_INSTRUMENT_MANIFEST:-/instruments/NSE_CM_EQUITY.csv}
      # IngestionConfig treats these as required (no code default) — the
      # container must pass them or the Java service exits at startup.
      RAW_TABLE_NAME: ${RAW_TABLE_NAME:-raw_table_1}
      ARROW_MAX_EVENT_AGE_MS: ${ARROW_MAX_EVENT_AGE_MS:-5000}
      ARROW_MAX_FUTURE_EVENT_SKEW_MS: ${ARROW_MAX_FUTURE_EVENT_SKEW_MS:-2000}
      # Clock offset limit in ms (default 2000 / 2s, T10). Configurable via env; overrides code default 2000.
      CLOCK_OFFSET_LIMIT_MS: ${CLOCK_OFFSET_LIMIT_MS:-2000}
      # T2 tunable backpressure (G2 Ingest) — streaming-3000: 50k/64M (1k) → 150k/192M (3k)
      # Primary: MAX_PENDING_APPEND_* + PENDING_APPEND_WARNING_PERCENT (80% warn / 100% halt).
      # Aliases: PENDING_MAX_RECORDS / PENDING_MAX_BYTES / PENDING_WARNING_PERCENT (primary wins).
      # Defaults raised for 3k: 150k records / 192MiB. For 1k dev, override to 50000 / 67108864.
      # Keep halt logic — fail-closed until restart, never silent drop.
      MAX_PENDING_APPEND_RECORDS: ${MAX_PENDING_APPEND_RECORDS:-150000}
      MAX_PENDING_APPEND_BYTES: ${MAX_PENDING_APPEND_BYTES:-201326592}
      PENDING_APPEND_WARNING_PERCENT: ${PENDING_APPEND_WARNING_PERCENT:-0.80}
      PENDING_MAX_RECORDS: ${PENDING_MAX_RECORDS:-}
      PENDING_MAX_BYTES: ${PENDING_MAX_BYTES:-}
      PENDING_WARNING_PERCENT: ${PENDING_WARNING_PERCENT:-}
      READINESS_FILE_PATH: /tmp/ingestion.ready
      # R-171: persistent log volume so the JSON log survives recreate.
      LOG_DIR: /data/ingestion/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f \"$${READINESS_FILE_PATH:-/tmp/ingestion.ready}\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    volumes:
      # T0: default N=1 single-file mount (backward compatible) + directory
      # mount exposing the host manifest directory for N=3: a single 3000-row
      # CSV placed in the host dir auto-shards via ARROW_HFT_CONNECTIONS=3.
      # Both mounts are read-only; the file mount serves the default
      # single-CSV path, the dir mount serves the multi-manifest case.
      - type: bind
        source: *manifest
        target: /instruments/NSE_CM_EQUITY.csv
        read_only: true
      - type: bind
        source: *manifest-dir
        target: /instruments/host
        read_only: true
      # R-171: /data/ingestion/logs holds the JSON log (LOG_DIR default).
      - ingestion-logs:/data/ingestion/logs

  # ---- CHG-122 loadgen profile (2026-09-02) --------------------------------
  # Image for the load-test data path: faketool + arrow-bridge + ingestion
  # JVM, ALL inside Docker on trading-net (policy: no host data-path
  # processes — guard G26 in pipeline-lib.sh fails a run if it finds any).
  # Behind the `loadgen` profile so `docker compose up` NEVER starts it;
  # pipeline-lib builds it (`docker compose build loadgen`) and launches
  # per-run containers with `docker run` (lifecycle belongs to the run
  # script: names pipeline-faketool / pipeline-ingestion, removed in
  # pipeline_cleanup).
  loadgen:
    build:
      # Same reactor-root context contract as the ingestion service above.
      context: ../..
      dockerfile: 02_services/01_ingestion/Dockerfile.loadgen
      # G27b content staleness stamp — pipeline-lib exports
      # LOADGEN_BUILD_STAMP (sha256 of all build inputs) before building.
      args:
        BUILD_STAMP: ${LOADGEN_BUILD_STAMP:-nostamp}
    image: pipeline-loadgen:1.0.0
    networks: [trading-net]
    profiles: ["loadgen"]

  # ---- T3 offline execution bridge profile -------------------------------
  # This is deliberately not part of the default stack. It is credential-free
  # in fake/disabled mode and has no host port. T8 will add the gateway and
  # Nautilus service to execution-net and provide the end-to-end probe.
  execution-bridge:
    profiles: [execution-t3]
    build:
      # The bridge Dockerfile copies paths relative to the code/ reactor root,
      # matching the ingestion image build context above.
      context: ../..
      dockerfile: 02_services/06_execution_bridge/Dockerfile
    env_file:
      - .env
      - secrets.env

    networks: [execution-net, arrow-egress]
    environment:
      EXECUTION_BRIDGE_AUTH_TOKEN: ${EXECUTION_BRIDGE_AUTH_TOKEN:-local-only}
      # Live mode authenticates to Arrow with the real broker creds (injected
      # below) and only observes order-updates; the executor gate stays HALTED
      # so no order is ever sent until a sanctioned approval advances it.
      # CHG-047: the mode MUST default to disabled, never live — the sanctioned
      # P4.1 approval path is the only way to reach ENABLED. Override
      # EXECUTION_BRIDGE_MODE=live only for a sanctioned sandbox run.
      EXECUTION_BRIDGE_MODE: ${EXECUTION_BRIDGE_MODE:-disabled}
      EXECUTION_BRIDGE_LISTEN_ADDR: 0.0.0.0:8787
      ARROW_APP_ID: ${ARROW_APP_ID}
      ARROW_APP_SECRET: ${ARROW_APP_SECRET}
      ARROW_USER_ID: ${ARROW_USER_ID}
      ARROW_PASSWORD: ${ARROW_PASSWORD}
      ARROW_TOTP_KEY: ${ARROW_TOTP_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---- T8 execution topology (private, profile-gated) ----------------------
  # execution-gateway (Java) + nautilus (Rust) on execution-net, zero host
  # ports, fail-closed. Both are profile-gated (execution-t3) so the default
  # stack stays lean. The gateway needs Fluss (coordinator/tablet) and forwards
  # intents to the private nautilus endpoint; nautilus talks only to
  # gateway/bridge — never to public Arrow REST (T4 boundary, CHG-053).
  # No `ports:` on either (T8 gate 3); only execution-bridge joins arrow-egress.
  execution-gateway:
    profiles: [execution-t3]
    build:
      context: ../..
      dockerfile: 02_services/06_execution_gateway/Dockerfile
    networks: [trading-net, execution-net]
    restart: unless-stopped
    depends_on: [fluss-coordinator, fluss-tablet]
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      GATEWAY_BIND_HOST: 0.0.0.0
      GATEWAY_BIND_PORT: "9180"
      NAUTILUS_PRIVATE_ENDPOINT: http://nautilus:9190/v1/intents
      GATEWAY_PROTOCOL_VERSION: execution-gateway.v2
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-local-dev-only}
      ACCOUNT_SCOPE_ID: ${ACCOUNT_SCOPE_ID:-dev-scope}
      EXECUTION_PARTITION_ID: ${EXECUTION_PARTITION_ID:-dev-partition}
      GATEWAY_REQUEST_TIMEOUT_MS: "2000"
      GATEWAY_POLL_TIMEOUT_MS: "250"
      # CHG-092: GatewayConfig.fromEnv reads EXECUTION_ENABLED (default false, fail-closed);
      # without this mapping the gateway stays locked even when .env flips — /v1/events and
      # /control/approve would 503. Default false preserves the .env.example safety rule.
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-false}
  nautilus:
    profiles: [execution-t3]
    build:
      context: ../../02_services/04_executor
      dockerfile: Dockerfile
    networks: [execution-net]
    depends_on: [execution-gateway, execution-bridge]
    environment:
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-false}
      EXECUTOR_LISTEN_ADDR: 0.0.0.0:9190
      BRIDGE_ENDPOINT: http://execution-bridge:8787
      GATEWAY_ENDPOINT: http://execution-gateway:9180
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-local-dev-only}
      GATEWAY_PROTOCOL_VERSION: execution-gateway.v2
      # WP-2 remainder (2026-08-21): BRIDGE_ENDPOINT (above) selects the production
      # HttpBridgeClient transport; this token authenticates to the private execution-bridge.
      # Same source as the bridge's own EXECUTION_BRIDGE_AUTH_TOKEN so both sides agree.
      BRIDGE_AUTH_TOKEN: ${EXECUTION_BRIDGE_AUTH_TOKEN:-local-only}

  # ---- DDL apply contract (one-shot, dev/CI) ------------------------------
  # The full 9-step DDL application contract engine (DdlApplyTool + ddl_apply.py
  # + ddl_apply_smoke.py + the pinned DDL corpus) packaged so the contract runs
  # INSIDE the compose network: FLUSS_BOOTSTRAP resolves via compose DNS
  # (fluss-coordinator:9123) — no host /etc/hosts aliases. Not a long-running
  # service; run one-shot with `docker compose run --rm ddl-apply ...`:
  #   validate | apply | smoke | self-test  (see the entrypoint for flags/env).
  ddl-apply:
    build:
      # The Dockerfile COPYs the parent POM + common module + platform scripts +
      # DDL corpus, so the build context MUST be the repo root (../../../ from
      # this compose file), mirroring the ingestion build-context rule (R-002).
      context: ../../..
      dockerfile: code/01_platform/01_docker/ddl-apply/Dockerfile
    networks: [trading-net]
    depends_on: [fluss-coordinator, fluss-tablet]
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
    volumes:
      # Evidence lands on the host at repo-root logs/ddl-apply (same dir the
      # host-side contract writes), so host automation can read the records.
      # The entrypoint self-heals ownership each run: it claims ONLY the
      # evidence ROOT dir for the non-root engine user (uid/gid 10001,
      # DDL_APPLY_UID/GID overridable) — a top-level, non-recursive chown +
      # setgid 2775 — and descendants inherit the group via the setgid bit, so
      # records land group-writable (664). Redirect to any dedicated dir with
      # DDL_APPLY_EVIDENCE_DIR (never a mount root: only that dir is claimed).
      # Host delete/rotate without sudo needs a one-time shared group (then
      # re-login):
      #   sudo groupadd -g 10001 ddlapply && sudo usermod -aG ddlapply $USER
      - ../../../logs/ddl-apply:/app/logs/ddl-apply

  # ---- EOD controller (SCH-23, one-shot, dev/CI) --------------------------
  # The plain-JVM EOD controller CLI (EodControllerTool + eod_controller.py)
  # inside the compose network — same image as ddl-apply (it already carries
  # the common classes + the pinned jars). Not long-running; run one-shot:
  #   docker compose run --rm eod-controller status
  #   docker compose run --rm eod-controller run
  #   docker compose run --rm eod-controller extend --dry-run
  # Env: FLUSS_BOOTSTRAP via compose DNS; EOD_DATABASE / EOD_STATE_TABLE /
  # EOD_TABLES / EOD_TTL / EOD_SAFETY_FLOOR / EOD_EXTENSION / EOD_OFFLOAD /
  # EOD_ZONE pass through (defaults live in the tool). The state table must
  # exist first: `make ddl APPLY=1` (26_eod_offload_state.sql, manifest 24).
  eod-controller:
    build:
      context: ../../..
      dockerfile: code/01_platform/01_docker/ddl-apply/Dockerfile
    entrypoint: []
    networks: [trading-net]
    depends_on: [fluss-coordinator, fluss-tablet]
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      EOD_M2_REPO: /opt/ddl-apply/m2/repository
    command: ["python3", "/app/code/01_platform/04_scripts/eod_controller.py"]

  # ── Disabled services (uncomment as each phase is built) ────────────────
  #
  #
  compute:
    <<: *flink-common
    # CRITICAL — one-shot launcher, NOT a long-running service: it submits
    # jobs and exits. `restart: unless-stopped` (inherited from flink-common)
    # restarts it on ANY exit — including clean exit 0 — and every restart
    # re-submits the babysitter/safety-halt pair, producing unbounded
    # duplicate jobs (observed: 16 duplicates consuming all 10 TM slots,
    # 2026-08-26). Override to `no`: the launcher runs once; job supervision
    # is Flink's job (restart strategies on the JM).
    restart: "no"
    build:
      # P2-107: build from the service dir as context — the Dockerfile's COPY
      # is now context-relative (submit-jobs.sh), so a bare repo-root context
      # would break the build.
      context: ../../02_services/02_compute
      dockerfile: Dockerfile
    depends_on: [flink-jobmanager, flink-taskmanager]
    volumes:
      - flink-checkpoints:/checkpoints
      # Native split: the jar is a host artifact, mounted live — a code change
      # needs only `mvn package` (no image rebuild). The image carries the
      # platform + launcher only; the jar is the mount point.
      - ../../02_services/02_compute/target/compute.jar:/opt/flink-jobs/compute.jar:ro
    environment:
      # P5-007: merge the anchor — a bare environment: map REPLACED
      # &flink-common-env wholesale, so the launcher lost FLUSS_BOOTSTRAP,
      # CHECKPOINT_DIR/SAVEPOINT_DIR, STATE_BACKEND*, PARALLELISM,
      # FLUSS_PROPERTIES... and its submit scripts connected to
      # localhost:9123 instead of fluss-coordinator:9123 (same failure mode
      # as the TM note on the anchor itself).
      <<: *flink-common-env
      # SafetyHaltJob requires SAFETY_MANIFEST_TOKENS (comma-separated
      # instrument tokens). Dev default: empty → submit-jobs.sh skips the
      # safety consumer with a warning (signal + babysitter still deploy).
      # Production MUST set this (fail-closed).
      SAFETY_MANIFEST_TOKENS: ${SAFETY_MANIFEST_TOKENS:-}
      # SignalJob is managed by `make rollout-savepoint`, not the compute
      # launcher (a second instance would split-brain on raw_table_1).
      # COMPUTE_SUBMIT_SIGNAL=1 opts the launcher in (fresh deploy only).
      COMPUTE_SUBMIT_SIGNAL: ${COMPUTE_SUBMIT_SIGNAL:-0}
  #
  # executor: superseded by the active `nautilus` service above (execution-t3
  # profile, CHG-053/T4 boundary — no Arrow creds, private gateway/bridge
  # only). The `nautilus` service is the Rust executor on `execution-net`.
  # Keep no top-level `executor:` here — the T8 offline gate requires
  # `executor stays disabled` (literal `^  executor:` must not appear).

  # ---- Infrastructure observability (2026-08-22 single-pane) --------------
  # Host + container metrics for OpenObserve. Always on (default stack) —
  # single-pane requires infra/JVM/host visibility even without trading.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    networks: [trading-net]
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      # P5-026: --path.rootfs — without it the /:/rootfs mount is dead
      # config: the filesystem/diskstat/textfile collectors scan the
      # container's own overlay root instead of the host.
      - --path.rootfs=/rootfs
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    networks: [trading-net]
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true

  # ---- Observability ------------------------------------------------------
  # OpenObserve = single source of truth (Option A, user-approved 2026-08-08):
  # metrics + dashboards + alert rules in one org (`default`), folders/prefix
  # per phase (INGESTION now; SIGNAL / EXECUTOR later). The collector is the
  # standard OTel transport — deliberately NOT in the ingestion critical path.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    env_file:
      - .env
      - secrets.env

    restart: unless-stopped
    networks: [trading-net]
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      # R-171/P8.2: collector reads the same ingestion JSON logs the ingestion
      # service writes (filelog receiver, /data/ingestion/logs/*.json).
      - ingestion-logs:/data/ingestion/logs:ro
      # P8.2 (tracker 14): flink_logs stream — JobManager/TaskManager file
      # logs (flink-logs volume, /opt/flink/log/*.log inside the flink
      # containers) read by the flink_filelog receiver.
      - flink-logs:/data/flink/logs:ro
      # P8.1 (tracker 14 box 827): fluss_logs stream — CoordinatorServer /
      # TabletServer logs (fluss-logs volume, /opt/fluss/log/*.log inside the
      # fluss containers) read by the filelog/fluss receiver.
      - fluss-logs:/data/fluss/logs:ro
      # 2026-08-22 single-pane: infra logs volume for infrastructure_logs.
      - infra-logs:/data/infra/logs:ro
    environment:
      O2_AUTH_BASIC: ${O2_AUTH_BASIC}
    depends_on: [openobserve]

  openobserve:
    restart: unless-stopped
    networks: [trading-net]
    image: ${OPENOBSERVE_IMAGE:?set OPENOBSERVE_IMAGE to an immutable digest}
    env_file:
      - .env
      - secrets.env

    ports:
      - "5080:5080"
      - "5081:5081"
    environment:
      ZO_ROOT_USER_EMAIL: ${O2_USER:-admin@example.com}
      ZO_ROOT_USER_PASSWORD: ${O2_PASSWORD}
      # Dev: O2 default holds data 600s in the WAL before it is searchable
      # (ZO_MAX_FILE_RETENTION_TIME=600). 60s keeps dev data visible within
      # a minute; production overrides this via .env.
      ZO_MAX_FILE_RETENTION_TIME: ${ZO_MAX_FILE_RETENTION_TIME:-60}
      ZO_MAX_FILE_SIZE_ON_DISK: ${ZO_MAX_FILE_SIZE_ON_DISK:-128}
      ZO_MAX_FILE_SIZE_IN_MEMORY: ${ZO_MAX_FILE_SIZE_IN_MEMORY:-128}
      # Dev: alert destination dev-webhook posts to http://localhost:9999
      # (receiver shares this netns); the SSRF guard blocks loopback by
      # default (dev only — remove in prod).
      ZO_SSRF_ALLOW_LOOPBACK: ${ZO_SSRF_ALLOW_LOOPBACK:-true}
      # 2026-08-22 single-pane: cap O2 so it cannot starve collector (10-observability.md resource budget).
      # 48GB VM: 8-12GB for O2, 36GB for collector+OS; alert >14GB 60s.
      ZO_MEMORY_LIMIT: ${ZO_MEMORY_LIMIT:-12g}
      ZO_MEMORY_ALERT_THRESHOLD: ${ZO_MEMORY_ALERT_THRESHOLD:-14g}
    volumes: [openobserve-data:/data]

  # G6 alert routing — persistent single-webhook consumer (successor of the
  # CHG-093 stdout receiver). Shares OpenObserve's network namespace so the
  # alert destination URL http://localhost:9999/noop resolves inside O2
  # (localhost would otherwise mean the O2 container itself, and O2 v0.91.5's
  # SSRF DNS resolver blocks every private-ranged target — 10/8, 172.16/12,
  # 192.168/16 — even with ZO_SSRF_ALLOW_LOOPBACK=true, which only exempts
  # 127/8). Deliveries are appended to alert-store:/data/alerts/alerts.jsonl
  # (durable across restarts) and queryable via GET /alerts, /stats, /healthz
  # (only from inside the netns: docker exec + python urllib — see
  # 04_scripts/alert-routing-selftest.sh). Production: point the O2
  # destination at a real pager; the JSONL record format is the contract.
  alert-consumer:
    restart: unless-stopped
    image: python:3.11-slim
    network_mode: "service:openobserve"
    depends_on: [openobserve]
    volumes:
      - ./alert-consumer.py:/app/alert-consumer.py:ro
      - alert-store:/data/alerts
    command: ["python3", "/app/alert-consumer.py"]

  # ---- MinIO: S3-compatible lake for Fluss Iceberg tiering (dev) ----------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    env_file:
      - .env
      - secrets.env

    restart: unless-stopped
    networks: [trading-net]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    env_file:
      - .env
      - secrets.env

    networks: [trading-net]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin} --quiet;
      /usr/bin/mc mb myminio/${R2_BUCKET:-fluss-warehouse} --ignore-existing --quiet;
      /usr/bin/mc anonymous set public myminio/${R2_BUCKET:-fluss-warehouse} --quiet || true;
      echo 'minio-init: bucket ${R2_BUCKET:-fluss-warehouse} ready';
      exit 0;
      "
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      R2_BUCKET: ${R2_BUCKET:-fluss-warehouse}
    restart: "no"
