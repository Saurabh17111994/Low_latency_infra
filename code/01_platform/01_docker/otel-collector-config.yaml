# =============================================================================
# OTel Collector — ingestion telemetry bridge to OpenObserve
#
# Topology (observability-only; NEVER in the ingestion critical path):
#   Java ingestion (OtlpMetricsEmitter) --OTLP/HTTP--> collector :4318
#     --> otlphttp exporter --> openobserve :5080 /api/{org}/v1/metrics
#   Java ingestion JSON logs (/data/ingestion/logs/*.json) --filelog receiver-->
#     same pipeline --> openobserve (logs stream)
#
# The collector normalizes the service's hand-rolled OTLP JSON into canonical
# OTLP and holds the OpenObserve Basic auth (ingestion code carries no creds).
# Export failures are exposed as otelcol_exporter_send_failed_metric_points
# (the otelcol 0.123.0 naming — present-tense send_failed; verified against the
# live stream 2026-08-11), which OpenObserve itself alerts on (end-to-end
# delivery guarantee). retry_on_failure keeps retrying within max_elapsed_time
# (5m), so the counter only fires on TERMINAL export failure — exactly the
# "persist beyond the approved interval" alert semantics.
#
# Phase 2 (approved scope): filelog receiver for /data/ingestion/logs/*.json
# to make OpenObserve the single pane for metrics + logs. Enabled 2026-08-11
# (tracker 14 P8.2 box 10); the SignalJob structured-log half (flink_logs) is
# live from the distributed job (P8.2 evidence 2026-08-11).
# 2026-08-22 single-pane (10-observability.md re-scope): collector now owns
# ALL project observability — trading + infra/JVM/host/container/traces. No
# service bypasses it. Infra sources: node_exporter (host), cAdvisor
# (containers), JVM OTel agent (jvm.*), host journald/filelog, OTLP traces.
#
# T11 (streaming-3000 hardening, G3 Compute, 2026-08-22) — cardinality bounds:
#   1. Metrics aggregation 15s: every metric series lands at a 15s cadence
#      (prometheus scrape_interval 15s per job; OTLP metric pipelines use the
#      batch/metrics processor with a 15s timeout).
#   2. Global + slot metrics ALWAYS (no token label -> pass). Per-token series
#      are hard-bounded to a top-20 allowlist by filter/top20-token-metrics on
#      BOTH metric pipelines: the env METRICS_TOP20_TOKENS_REGEX carries the
#      anchored alternation regex of the (<=20) sampled tokens; the default
#      value `a^` never matches, so per-token series are DROPPED unless ops
#      explicitly allowlists them (3k tokens x 10 metrics = 30k-series risk
#      -> <=20 series per metric family).
#   3. Tick logs sampled 1%: transform/tick-sampling marks severity>=WARN or
#      level ERROR/WARN records (errors + gap/drop events) with
#      sampling.priority=100 -> probabilistic_sampler/tick keeps them 100%;
#      all other (INFO tick) records are sampled 1% by hashing a per-record
#      seed derived from the log4j2 instant (verified on 0.123.0).
# =============================================================================
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
  filelog:
    include: [/data/ingestion/logs/*.json]
    start_at: end
    operators:
      - type: json_parser
        parse_to: body
      - type: add
        field: resource.service.name
        value: ingestion
      # Stream routing happens in the exporter via the stream-name HTTP
      # header (O2 v0.91.5 ZO_GRPC_STREAM_HEADER_KEY) — not attributes.
  # P8 (tracker 14): scrape Flink PrometheusReporter endpoints. 2026-08-22
  # single-pane: also scrape infra exporters (node_exporter:9100,
  # cadvisor:8080) on the same trading-net. Collector holds O2 auth; all
  # scrape targets stay credential-free.
  prometheus:
    config:
      scrape_configs:
        - job_name: flink
          scrape_interval: 15s
          static_configs:
            - targets: ["flink-jobmanager:9249", "flink-taskmanager:9249"]
        - job_name: infra-host
          scrape_interval: 15s
          static_configs:
            - targets: ["node-exporter:9100"]
        - job_name: infra-containers
          scrape_interval: 15s
          static_configs:
            - targets: ["cadvisor:8080"]
  # P8.2 (tracker 14): flink_logs stream from the flink-logs volume
  # (/opt/flink/log/<role>.log, plain-text log4j output). ID must use the
  # type/name syntax (filelog/flink), not a bare custom type name.
  filelog/flink:
    include: [/data/flink/logs/*.log]
    start_at: beginning
    operators:
      - type: add
        field: resource.service.name
        value: flink
  # P8.1 (tracker 14 box 827): fluss_logs stream from the fluss-logs volume
  # (/opt/fluss/log/*.log — fluss--<role>-*.log log4j2 output, verified live
  # 2026-08-11). Reads CoordinatorServer + TabletServer logs: connection,
  # leadership, storage, replication, lake tiering.
  filelog/fluss:
    include: [/data/fluss/logs/*.log]
    start_at: beginning
    operators:
      - type: add
        field: resource.service.name
        value: fluss
  # 2026-08-22 single-pane: infrastructure logs (host journald + container).
  # CHG-263: the include list is now exactly what this container can open. The old
  # list named two paths that produced nothing: `/data/infra/logs/*.log` lived in a
  # named volume no service ever wrote to (the comment called the /var/log bind
  # "optional" and no bind was declared anywhere), and `/var/log/syslog` — the system
  # log itself, 47 MB and actively written on the rehearsal host — has no `.log`
  # suffix, so the glob could never match it. Routes to infrastructure_logs (O2 header).
  filelog/infrastructure:
    include: [/var/log/*.log, /var/log/syslog]
    start_at: end
    operators:
      - type: add
        field: resource.service.name
        value: infra

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  otlphttp/openobserve:
    # Base path: the exporter appends /v1/metrics -> .../api/default/v1/metrics
    # Port 5080 = O2 HTTP API (OTLP HTTP included). 5081 is gRPC-only.
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:O2_AUTH_BASIC}"
    compression: gzip
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
  # Logs route to O2's platform_logs stream via the stream-name HTTP header
  # (ZO_GRPC_STREAM_HEADER_KEY, default "stream-name"; O2 v0.91.5 source
  # src/handler/http/request/logs/ingest.rs otlp_logs_write — verified by
  # direct probes + collector config 2026-08-11). OTLP attributes such as
  # stream_name are NOT honored, so the header is the only routing mechanism.
  otlphttp/openobserve-logs:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:O2_AUTH_BASIC}"
      stream-name: platform_logs
    compression: gzip
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
  # P8 (tracker 14): Flink metrics -> O2 Prometheus remote-write (the same
  # O2 instance; PromQL queries hit /api/{org}/prometheus/api/v1/query — no
  # _prometheus underscore; that route 404s, verified 2026-08-11).
  # stream-name: flink_logs routes log records to the flink_logs stream
  # (O2 v0.91.5 ZO_GRPC_STREAM_HEADER_KEY) instead of platform_logs.
  otlphttp/openobserve-flink-logs:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:O2_AUTH_BASIC}"
      stream-name: flink_logs
    compression: gzip
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
  # P8.1 (tracker 14 box 827): Fluss server logs -> fluss_logs stream.
  otlphttp/openobserve-fluss-logs:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:O2_AUTH_BASIC}"
      stream-name: fluss_logs
    compression: gzip
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
  # P8.1 (tracker 14 box 828): SignalJob lifecycle alert events (OTLP logs
  # from the app) -> trading_alerts stream. O2 alert RULES (24, incl. the
  # SIGNAL-* set) route to destinations/webhooks in v0.91.5 — this stream is
  # the application-emitter contract for deterministic events (startup mode,
  # schema-preflight failure); runtime failures stay on the metrics rules.
  otlphttp/openobserve-trading-alerts:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:O2_AUTH_BASIC}"
      stream-name: trading_alerts
    compression: gzip
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
  # 2026-08-22 single-pane: infrastructure logs -> infrastructure_logs stream.
  otlphttp/openobserve-infra-logs:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:O2_AUTH_BASIC}"
      stream-name: infrastructure_logs
    compression: gzip
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
  # 2026-08-22 single-pane: OTLP traces -> traces stream (O2 APM).
  otlphttp/openobserve-traces:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:O2_AUTH_BASIC}"
      stream-name: traces
    compression: gzip
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
  prometheusremotewrite/openobserve:
    endpoint: http://openobserve:5080/api/default/prometheus/api/v1/write
    headers:
      Authorization: "Basic ${env:O2_AUTH_BASIC}"
    # Remote-write protocol: snappy only (default) — gzip is rejected.
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

processors:
  batch:
    send_batch_size: 512
    timeout: 5s
  # T11: 15s aggregation window for METRIC pipelines (scrape cadence parity).
  # Log pipelines keep the 5s batch above (low volume after tick sampling).
  batch/metrics:
    send_batch_size: 512
    timeout: 15s
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  # T11: keep errors/gaps at 100% and give every log record per-record
  # sampling entropy. sampling.priority >= 100 forces the sampler to KEEP the
  # record (probabilistic_sampler logs mode, v0.123.0: priority attr is
  # interpreted as a percentage; absent -> configured sampling_percentage).
  # The seed is the log4j2 event instant (always present in JsonLayout
  # output), so the 1% decision is uniform per record, not per token.
  transform/tick-sampling:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - >-
            set(attributes["sampling.priority"], 100)
            where severity_number >= SEVERITY_NUMBER_WARN
            or body["level"] == "ERROR" or body["level"] == "WARN"
          - >-
            set(attributes["sampling.seed"],
            Int(body["instant"]["epochSecond"]) * 1000000000
            + Int(body["instant"]["nanoOfSecond"]))
  # T11: 1% sample of tick (non-error) logs; priority records pass 100%.
  probabilistic_sampler/tick:
    sampling_percentage: 1
    attribute_source: record
    from_attribute: sampling.seed
    sampling_priority: sampling.priority
  # T11: top-20 per-token sampler guard — DROP any datapoint carrying a
  # per-token label whose value is not in the allowlist regex. Global and
  # slot series (no token label) always pass. Applied to both metric
  # pipelines (OTLP + prometheus scrape). Default `a^` never matches:
  # per-token series are impossible until ops sets the env to the real
  # top-20 anchored pattern (e.g. ^(AAA|BBB|...|TTT)$).
  filter/top20-token-metrics:
    error_mode: ignore
    metrics:
      datapoint:
        - >-
          attributes["token"] != nil
          and not IsMatch(attributes["token"],
          "^${env:METRICS_TOP20_TOKENS_REGEX:-a^}$")
  # Native phase 1 (P1-133): OTLP routing guards. The `otlp` receiver is
  # SHARED — every pipeline listing it gets a copy of every OTLP record — so
  # the two OTLP-log consumers split by service.name: ingestion keeps only its
  # own, trading keeps everything except ingestion (SignalJob flow unchanged).
  # With error_mode ignore, records lacking service.name are DROPPED from the
  # ingestion pipeline (safe: unknown senders never leak into platform_logs)
  # and KEPT in trading (today's unattributed flow is preserved exactly).
  filter/ingestion-logs-only:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["service.name"] != "ingestion"'
  filter/drop-ingestion-logs:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["service.name"] == "ingestion"'

service:
  extensions: [health_check]
  pipelines:
    # T11: 15s aggregation (batch/metrics) + top-20 per-token guard; global
    # and slot metrics always exported.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch/metrics, filter/top20-token-metrics]
      exporters: [otlphttp/openobserve]
    # P8: Flink + infra Prometheus scrape -> O2 remote-write (same O2).
    # 2026-08-22: job infra-host (node_exporter) + infra-containers (cAdvisor)
    # joins flink on the prometheus receiver; single O2 remote-write export.
    # T11: same 15s aggregation + top-20 per-token guard as the OTLP metrics
    # pipeline (Flink per-token series would otherwise scale with the token
    # universe: 3k tokens = 30k-series risk).
    metrics/prometheus:
      receivers: [prometheus]
      processors: [memory_limiter, batch/metrics, filter/top20-token-metrics]
      exporters: [prometheusremotewrite/openobserve]
    # T11: tick logs sampled 1% (transform marks ERROR/WARN/gap records
    # priority 100 -> kept; INFO tick records sampled 1%).
    logs:
      receivers: [filelog]
      processors:
        - memory_limiter
        - batch
        - transform/tick-sampling
        - probabilistic_sampler/tick
      exporters: [otlphttp/openobserve-logs]
    # Native phase 1 (P1-133): ingestion agent logs (OTEL_LOGS_EXPORTER=otlp,
    # Dockerfile) -> platform_logs stream. Dedicated pipeline, NOT the shared
    # `logs` one: agent records carry no body[instant] seed so tick-sampling
    # cannot apply, and service volume is lifecycle/warning-rate (no per-tick
    # logging — verified in code), so no sampler. File path untouched.
    logs/ingestion:
      receivers: [otlp]
      processors: [memory_limiter, filter/ingestion-logs-only, batch]
      exporters: [otlphttp/openobserve-logs]
    # P8.2: flink file logs -> flink_logs stream.
    logs/flink:
      receivers: [filelog/flink]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve-flink-logs]
    # P8.1: fluss server logs -> fluss_logs stream.
    logs/fluss:
      receivers: [filelog/fluss]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve-fluss-logs]
    # P8.1: SignalJob OTLP logs (startup-mode / schema-preflight events) ->
    # trading_alerts stream. The otlp receiver serves both HTTP (4318) and
    # gRPC (4317); OTLP logs arriving on either route to this pipeline.
    logs/trading:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-ingestion-logs, batch]
      exporters: [otlphttp/openobserve-trading-alerts]
    # 2026-08-22 single-pane: infra file logs -> infrastructure_logs stream.
    logs/infrastructure:
      receivers: [filelog/infrastructure]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve-infra-logs]
    # 2026-08-22 single-pane: OTLP traces (gateway->nautilus->bridge,
    # SignalJob spans, sampled) -> traces stream. otlp receiver already
    # handles traces on both HTTP 4318 and gRPC 4317.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve-traces]
  # Self-telemetry: export the collector's own counters (notably
  # otelcol_exporter_send_failed_metric_points) through its own pipeline so
  # OpenObserve can alert when data stops arriving. Standard OTel pattern.
  telemetry:
    metrics:
      readers:
        - periodic:
            interval: 60000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://localhost:4318
