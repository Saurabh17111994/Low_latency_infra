# =============================================================================
# Docker Stack — Trading_project platform runtime, PRODUCTION (Option B)
#
# Authoritative deployment for docs/08_implementation/09-production-swarm.md
# DECISION 2026-08-20 v1 → v2 (single branch, single stack, role labels only).
#
#   v1 baseline (4 VMs): M1, M2, M3 = Swarm Manager + Worker (role=worker AND
#     role=manager); O1 = observability (outside Swarm). Workload constraint is
#     `node.labels.role == worker`, which M1-3 satisfy in v1; observability
#     services pin to the separate boolean `node.labels.observability == true`.
#   v2 evolution (7 VMs): `docker node update --availability drain M1 M2 M3`,
#     then label W1-3 (+ W4...) `role=worker` and deploy the SAME stack —
#     workloads migrate to workers, managers become Manager-ONLY. No stack
#     rewrite; 3-manager Raft quorum (2/3) is unchanged when workers are added.
#
# Swarm Raft = built-in manager consensus. No external Raft.
# ZK quorum != Swarm Raft quorum (tested via `docker node ls`, not ZooKeeper).
#
# This file is a Swarm STACK (docker stack deploy -c ...). Swarm ignores
# `build`, `depends_on`, and Compose `restart:`; use `deploy.*` for replicas,
# placement, resources, restart/update/rollback. Every image below MUST be a
# pinned immutable digest in production (see .env / runtime.lock) — no :latest.
# =============================================================================

version: "3.8"

# ---- Secrets: production uses Docker Swarm secrets (never committed) ------
# Declared `external: true`: create them out-of-band, e.g.
#   printf 'secret' | docker secret create aws_secret_access_key -
# Apps read at /run/secrets/<name>. This is the production secret model;
# development uses docker-compose.yml + .env (Option B separation).
secrets:
  aws_access_key_id:
    external: true
  aws_secret_access_key:
    external: true
  o2_password:
    external: true
  # base64("user:password") for the collector's O2 Basic header — the sh-less
  # collector reads it via the config's file: provider (see config variant).
  o2_auth_basic:
    external: true
  arrow_app_secret:
    external: true
  arrow_password:
    external: true
  arrow_totp_key:
    external: true
  execution_bridge_auth_token:
    external: true
  gateway_shared_secret:
    external: true

# ---- Shared service fragments (YAML anchors) --------------------------------
# P5-011: YAML merge keys are SHALLOW. A service that merges
# `<<: *common_workload` and then defines its own `deploy:` used to REPLACE
# the anchor's whole deploy map — silently dropping restart_policy.window,
# update_config.parallelism/delay/monitor/max_failure_ratio, rollback_config,
# and the default resources. The deploy defaults now live in their own anchor
# so every service merges deploy SUB-KEYS explicitly:
#     deploy:
#       <<: *deploy_workload   # inherits the policies below
#       replicas: ...          # + service-specific overrides
# Sub-map overrides (restart_policy/update_config/placement) still replace
# those maps wholesale — override only what actually differs.
#
# Rollout order is per service class. A ZooKeeper member rolls STOP-FIRST: the
# three members are pinned `max_replicas_per_node: 1`, and with start-first the
# replacement task needs a second eligible node — on a one-worker cluster, or in
# production with two of three workers down, it stays Pending while the old
# container keeps serving the old configuration, and the deploy reports success
# (measured 2026-09-20, CHG-259). Stopping one member of three keeps quorum, which
# is what ZooKeeper's own rolling-restart guidance assumes. Everything else stays
# start-first: those services benefit from overlapping the old and new task.
x-deploy-workload: &deploy_workload
  placement:
    constraints: [node.labels.role == worker]
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 4
    window: 120s
  update_config:
    order: start-first
    parallelism: 1
    delay: 10s
    failure_action: rollback
    monitor: 30s
    max_failure_ratio: 0.2
  rollback_config:
    order: stop-first
    parallelism: 1
    delay: 10s
  resources:
    # Explicit reservations/limits — protects manager headroom in v1 (the
    # 2 CPU / 2 GB per-VM manager reservation is enforced by node sizing +
    # these per-container limits, never exceeded past the 85% capacity alert).
    reservations:
      cpus: "0.25"
      memory: 512M
    limits:
      cpus: "4"
      memory: 8G

x-common-workload: &common_workload
  # Workload services run on role=worker nodes. v1: M1-3 carry role=worker
  # (they are Manager+Worker). v2: only W1-3 (+W4...) carry role=worker, so
  # workloads automatically leave the (drained) managers.
  deploy: *deploy_workload

# ---- Networks: encrypted overlay, internal control plane -------------------
# 09 § Security: `trading-net` and `execution-net` SHALL be encrypted overlays.
# `arrow-egress` carries only the broker order-path and is restricted to the
# execution bridge. No host ports on gateway/nautilus/bridge (T8 gate 3).
networks:
  trading-net:
    driver: overlay
    driver_opts:
      encrypted: "true"
  execution-net:
    driver: overlay
    driver_opts:
      encrypted: "true"
    internal: true
  arrow-egress:
    driver: overlay
    driver_opts:
      encrypted: "true"

# ---- Volumes: per-node durable, backed by named volume driver --------------
# G4 Durability T9: flink-checkpoints volume is dev-local only (Compose keeps
# file:///checkpoints). Production checkpoints are encrypted S3 (s3:// / s3a://,
# bucket AES256) — SignalJobConfig fails fast if CHECKPOINT_DIR missing or non-S3
# when DEPLOYMENT_ENV=production or PROFILE=prod; the volume is retained for
# logs only in prod (not durable checkpoints).
volumes:
  zk-data-1:
  zk-data-2:
  zk-data-3:
  fluss-data:
  fluss-tablet-data-1:
  fluss-tablet-data-2:
  fluss-tablet-data-3:
  flink-checkpoints:
  flink-logs:
  fluss-logs:
  openobserve-data:
  ingestion-logs:
  # G6 alert routing — durable O2 alert delivery history (alert-consumer).
  alert-store:

# ---- Configs: files mounted into service containers ------------------------
# docker-stack.yml ships the collector config as a Swarm config (the collector
# image is distroless; config must come from an overlay-mounted file, not a
# host bind). The .swarm variant reads O2 creds via ${file:} instead of env.
configs:
  # CHG-273: the collector is split in two, and each half gets its own config.
  # `otel-collector-config` = the network half (one replica: Prometheus scrapes +
  # OTLP push). `otel-collector-logs-config` = the per-host file half (global:
  # the filelog receivers), because a file belongs to exactly one node.
  otel-collector-config:
    file: ./otel-collector-config.swarm.yaml
  otel-collector-logs-config:
    file: ./otel-collector-logs.swarm.yaml
  alert-consumer-src:
    file: ./alert-consumer.py
  fluss-r2-secrets-bridge:
    file: ./fluss-r2-secrets-from-file.sh
  # Instrument manifest, delivered as a Swarm config (never a per-VM file copy).
  # Swarm configs are immutable: a revised manifest must be committed under a NEW
  # config name, which fails loudly instead of silently serving stale instruments.
  manifest-nse:
    file: ${MANIFEST_FILE:-./instruments/NSE_CM_EQUITY.csv}

services:
  # ---- ZooKeeper: 3-member ensemble (quorum 2-of-3), one member per VM ------
  # Production HA target (09 § Storage): three named members, each pinned to a
  # distinct worker via `max_replicas_per_node: 1` + spread. Exactly one member
  # per workload VM — they must never co-locate (anti-co-location). A single
  # member is NOT HA evidence; quorum is only tested on a 3-node rig (M3).
  zookeeper-1:
    image: ${ZOOKEEPER_IMAGE:-zookeeper@sha256:43d39109cbd4de394742efbfc162a8a0a93731e806374b71f3865f4ef4460a56}
    networks: [trading-net]
    healthcheck:
      # Liveness only — never `zkServer.sh status`: that requires quorum, and Swarm
      # publishes a DNS record only for tasks whose healthcheck passes, so members
      # could never resolve each other (bootstrap deadlock; see CHG-249).
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    environment:
      ZOO_MY_ID: "1"
      # Whitespace separated: the image appends ONE zoo.cfg line per token. With
      # ';' the whole ensemble collapses into a single invalid line and ZK exits 2.
      ZOO_SERVERS: "server.1=zookeeper-1:2888:3888 server.2=zookeeper-2:2888:3888 server.3=zookeeper-3:2888:3888"
      # clientPort: without it `zkServer.sh status` can never pass AND nothing
      # listens on 2181 for Flink/Fluss. quorumListenOnAllIPs: bind the election
      # port without resolving our own service name. admin.*: pin the liveness
      # endpoint to loopback so it is never reachable from the network.
      ZOO_CFG_EXTRA: "clientPort=2181 quorumListenOnAllIPs=true admin.serverAddress=127.0.0.1 admin.serverPort=8080 metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider metricsProvider.httpPort=7000"
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
        preferences: [{spread: node.labels.role}]
      restart_policy: {condition: any}
      update_config: {order: stop-first, failure_action: rollback}
      resources:
        limits: {cpus: "1", memory: 2G}
    volumes:
      - zk-data-1:/data

  zookeeper-2:
    image: ${ZOOKEEPER_IMAGE:-zookeeper@sha256:43d39109cbd4de394742efbfc162a8a0a93731e806374b71f3865f4ef4460a56}
    networks: [trading-net]
    healthcheck:
      # Liveness only — see zookeeper-1 for why `zkServer.sh status` deadlocks.
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    environment:
      ZOO_MY_ID: "2"
      # Whitespace separated (one zoo.cfg line per token) — see zookeeper-1.
      ZOO_SERVERS: "server.1=zookeeper-1:2888:3888 server.2=zookeeper-2:2888:3888 server.3=zookeeper-3:2888:3888"
      ZOO_CFG_EXTRA: "clientPort=2181 quorumListenOnAllIPs=true admin.serverAddress=127.0.0.1 admin.serverPort=8080 metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider metricsProvider.httpPort=7000"
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
        preferences: [{spread: node.labels.role}]
      restart_policy: {condition: any}
      update_config: {order: stop-first, failure_action: rollback}
      resources:
        limits: {cpus: "1", memory: 2G}
    volumes:
      - zk-data-2:/data

  zookeeper-3:
    image: ${ZOOKEEPER_IMAGE:-zookeeper@sha256:43d39109cbd4de394742efbfc162a8a0a93731e806374b71f3865f4ef4460a56}
    networks: [trading-net]
    healthcheck:
      # Liveness only — see zookeeper-1 for why `zkServer.sh status` deadlocks.
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    environment:
      ZOO_MY_ID: "3"
      # Whitespace separated (one zoo.cfg line per token) — see zookeeper-1.
      ZOO_SERVERS: "server.1=zookeeper-1:2888:3888 server.2=zookeeper-2:2888:3888 server.3=zookeeper-3:2888:3888"
      ZOO_CFG_EXTRA: "clientPort=2181 quorumListenOnAllIPs=true admin.serverAddress=127.0.0.1 admin.serverPort=8080 metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider metricsProvider.httpPort=7000"
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
        preferences: [{spread: node.labels.role}]
      restart_policy: {condition: any}
      update_config: {order: stop-first, failure_action: rollback}
      resources:
        limits: {cpus: "1", memory: 2G}
    volumes:
      - zk-data-3:/data

  # ---- Fluss: streaming bus + storage + lake tier --------------------------
  fluss-coordinator:
    <<: *common_workload
    image: ${FLUSS_IMAGE:?set FLUSS_IMAGE to an immutable digest}
    networks: [trading-net]
    # CHG-181: the image's CMD is only the usage fallback
    # (Entrypoint /docker-entrypoint.sh, Cmd "help"). With no
    # command the container prints usage and exits 0, so Swarm
    # reports the task as started while no server runs.
    command: ["coordinatorServer"]
    # Task-3 bridge: Swarm secrets arrive as files; this entrypoint
    # exports them into the environment before the stock entrypoint.
    entrypoint: ["/bin/sh", "/opt/fluss/bin/r2-secrets-from-file.sh"]
    healthcheck:
      # CHG-181 sibling: CMD-SHELL is dash (no /dev/tcp); probe
      # $HOSTNAME under bash, loopback as fallback.
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/$$HOSTNAME/9123 || echo > /dev/tcp/127.0.0.1/9123) >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy_workload
      replicas: 1
      resources:
        reservations:
          cpus: "1"
          memory: 2G
        limits:
          cpus: "4"
          memory: 6G
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
    configs:
      - source: fluss-r2-secrets-bridge
        target: /opt/fluss/bin/r2-secrets-from-file.sh
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      FLUSS_COORDINATOR_HOST: fluss-coordinator
      FLUSS_TABLET_HOST: fluss-tablet
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
      # Credentials arrive via Swarm secrets, bridged into the environment by
      # the entrypoint (fluss-r2-secrets-from-file.sh) before the JVM starts.
      # CHG-250: bind a LITERAL, never our own service name. Swarm publishes a
      # name only for tasks that are Running, so binding that name fails the
      # first time and can never retry into success - measured: "Failed to start
      # Netty server on endpoint INTERNAL://fluss-coordinator:0" / Caused by
      # UnresolvedAddressException at Netty checkResolvable, with the task
      # cycling in Starting (failed 3x) until update_config rolled it back.
      # advertised.listeners stays the service name: by the time a client
      # resolves it we are Running, which is exactly when it becomes resolvable.
      # D-A (same change, one layer deeper): the INTERNAL listener needs a fixed
      # port and an advertised name too. Port 0 publishes an ephemeral port, and
      # an unset advertised INTERNAL defaults to the bind value, so tablet-1
      # registered INTERNAL://0.0.0.0:40917 and the coordinator dialled 0.0.0.0
      # refused, ongoing (run7). 9122 is adjacent to CLIENT 9123, overlay-only.
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
        bind.listeners: INTERNAL://0.0.0.0:9122,CLIENT://0.0.0.0:9123
        advertised.listeners: INTERNAL://fluss-coordinator:9122,CLIENT://fluss-coordinator:9123
        internal.listener.name: INTERNAL
        remote.data.dir: s3://${R2_BUCKET:?set R2_BUCKET for tiering}/remote-data
        s3.endpoint: ${R2_ENDPOINT:?set R2_ENDPOINT for tiering}
        s3.endpoint.region: ${AWS_REGION:-auto}
        s3.access-key: $${env.AWS_ACCESS_KEY_ID}
        s3.secret-key: $${env.AWS_SECRET_ACCESS_KEY}
        s3.path.style.access: true
        s3.connection.ssl.enabled: true
        datalake.format: ${DATALAKE_FORMAT:-iceberg}
        datalake.iceberg.type: hadoop
        datalake.iceberg.warehouse: ${S3_WAREHOUSE_PATH:?set S3_WAREHOUSE_PATH for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint: ${R2_ENDPOINT:?set R2_ENDPOINT for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint.region: ${AWS_REGION:-auto}
        datalake.iceberg.iceberg.hadoop.fs.s3a.path.style.access: "true"
        datalake.iceberg.iceberg.hadoop.fs.s3.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.timeout: 30000
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.establish.timeout: 30000
    volumes:
      - fluss-data:/data
      - fluss-logs:/opt/fluss/log

  # ---- Fluss tablet servers (P5-001) ----------------------------------------
  # CRITICAL fix: a single `fluss-tablet` service with replicas: 3 shared ONE
  # service spec — all three tablet servers booted with identical identity
  # (tablet-server.id: 0, bind/advertised listeners on hostname fluss-tablet),
  # breaking log replication/failover (server identity must be unique, like
  # zookeeper-1/2/3). Split into three pinned services with distinct ids
  # (1/2/3) and listener hostnames. Data volumes are per-server (a shared
  # fluss-tablet-data would corrupt); fluss-data stays shared
  # (lake-snapshot offset contract, PROD-013). Tiered segments live on R2
  # (remote.data.dir), so no local remote-data volume remains.
  # Residue: co-location — tablet-1/2/3 each allow any worker (max_replicas_
  # per_node is per-service), so two tablets MAY share a node; the hard
  # guarantee is pinning via node.labels.fluss_tablet == N constraints once
  # nodes are labeled (same out-of-band model as role/observability labels).
  fluss-tablet-1:
    <<: *common_workload
    image: ${FLUSS_IMAGE:?set FLUSS_IMAGE to an immutable digest}
    networks: [trading-net]
    # CHG-181: the image's CMD is only the usage fallback
    # (Entrypoint /docker-entrypoint.sh, Cmd "help"). With no
    # command the container prints usage and exits 0, so Swarm
    # reports the task as started while no server runs.
    command: ["tabletServer"]
    # Task-3 bridge: Swarm secrets arrive as files; this entrypoint
    # exports them into the environment before the stock entrypoint.
    entrypoint: ["/bin/sh", "/opt/fluss/bin/r2-secrets-from-file.sh"]
    healthcheck:
      # CHG-181 sibling: CMD-SHELL is dash (no /dev/tcp); probe
      # $HOSTNAME under bash, loopback as fallback.
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/$$HOSTNAME/9124 || echo > /dev/tcp/127.0.0.1/9124) >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy_workload
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
      resources:
        reservations: {cpus: "1", memory: 2G}
        limits: {cpus: "4", memory: 6G}
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
    configs:
      - source: fluss-r2-secrets-bridge
        target: /opt/fluss/bin/r2-secrets-from-file.sh
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      FLUSS_COORDINATOR_HOST: fluss-coordinator
      FLUSS_TABLET_HOST: fluss-tablet-1
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
      # CHG-250: bind a literal, advertise the name (rationale: fluss-coordinator).
      # D-A: INTERNAL needs a fixed port (9125, adjacent to CLIENT 9124) and an
      # advertised name - port 0 + unset advertised INTERNAL registered
      # INTERNAL://0.0.0.0:<ephemeral>, which no peer can dial (run7).
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
        bind.listeners: INTERNAL://0.0.0.0:9125, CLIENT://0.0.0.0:9124
        advertised.listeners: INTERNAL://fluss-tablet-1:9125,CLIENT://fluss-tablet-1:9124
        internal.listener.name: INTERNAL
        tablet-server.id: 1
        kv.snapshot.interval: ${FLUSS_KV_SNAPSHOT_INTERVAL:-0s}
        data.dir: /tmp/fluss/data
        remote.data.dir: s3://${R2_BUCKET:?set R2_BUCKET for tiering}/remote-data
        s3.endpoint: ${R2_ENDPOINT:?set R2_ENDPOINT for tiering}
        s3.endpoint.region: ${AWS_REGION:-auto}
        s3.access-key: $${env.AWS_ACCESS_KEY_ID}
        s3.secret-key: $${env.AWS_SECRET_ACCESS_KEY}
        s3.path.style.access: true
        s3.connection.ssl.enabled: true
        datalake.format: ${DATALAKE_FORMAT:-iceberg}
        datalake.iceberg.type: hadoop
        datalake.iceberg.warehouse: ${S3_WAREHOUSE_PATH:?set S3_WAREHOUSE_PATH for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint: ${R2_ENDPOINT:?set R2_ENDPOINT for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint.region: ${AWS_REGION:-auto}
        datalake.iceberg.iceberg.hadoop.fs.s3a.path.style.access: "true"
        datalake.iceberg.iceberg.hadoop.fs.s3.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.timeout: 30000
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.establish.timeout: 30000
    volumes:
      - fluss-data:/data
      - fluss-tablet-data-1:/tmp/fluss/data
      - fluss-logs:/opt/fluss/log

  fluss-tablet-2:
    <<: *common_workload
    image: ${FLUSS_IMAGE:?set FLUSS_IMAGE to an immutable digest}
    networks: [trading-net]
    # CHG-181: the image's CMD is only the usage fallback
    # (Entrypoint /docker-entrypoint.sh, Cmd "help"). With no
    # command the container prints usage and exits 0, so Swarm
    # reports the task as started while no server runs.
    command: ["tabletServer"]
    # Task-3 bridge: Swarm secrets arrive as files; this entrypoint
    # exports them into the environment before the stock entrypoint.
    entrypoint: ["/bin/sh", "/opt/fluss/bin/r2-secrets-from-file.sh"]
    healthcheck:
      # CHG-181 sibling: CMD-SHELL is dash (no /dev/tcp); probe
      # $HOSTNAME under bash, loopback as fallback.
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/$$HOSTNAME/9124 || echo > /dev/tcp/127.0.0.1/9124) >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy_workload
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
      resources:
        reservations: {cpus: "1", memory: 2G}
        limits: {cpus: "4", memory: 6G}
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
    configs:
      - source: fluss-r2-secrets-bridge
        target: /opt/fluss/bin/r2-secrets-from-file.sh
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      FLUSS_COORDINATOR_HOST: fluss-coordinator
      FLUSS_TABLET_HOST: fluss-tablet-2
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
      # CHG-250: bind a literal, advertise the name (rationale: fluss-coordinator).
      # D-A: INTERNAL needs a fixed port (9125, adjacent to CLIENT 9124) and an
      # advertised name - port 0 + unset advertised INTERNAL registered
      # INTERNAL://0.0.0.0:<ephemeral>, which no peer can dial (run7).
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
        bind.listeners: INTERNAL://0.0.0.0:9125, CLIENT://0.0.0.0:9124
        advertised.listeners: INTERNAL://fluss-tablet-2:9125,CLIENT://fluss-tablet-2:9124
        internal.listener.name: INTERNAL
