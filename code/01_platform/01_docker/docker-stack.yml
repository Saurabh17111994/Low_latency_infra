# =============================================================================
# Docker Stack — Trading_project platform runtime, PRODUCTION (Option B)
#
# Authoritative deployment for docs/08_implementation/09-production-swarm.md
# DECISION 2026-08-20 v1 → v2 (single branch, single stack, role labels only).
#
#   v1 baseline (4 VMs): M1, M2, M3 = Swarm Manager + Worker (role=worker AND
#     role=manager); O1 = observability (outside Swarm). Workload constraint is
#     `node.labels.role == worker`, which M1-3 satisfy in v1; observability
#     services pin to the separate boolean `node.labels.observability == true`.
#   v2 evolution (7 VMs): `docker node update --availability drain M1 M2 M3`,
#     then label W1-3 (+ W4...) `role=worker` and deploy the SAME stack —
#     workloads migrate to workers, managers become Manager-ONLY. No stack
#     rewrite; 3-manager Raft quorum (2/3) is unchanged when workers are added.
#
# Swarm Raft = built-in manager consensus. No external Raft.
# ZK quorum != Swarm Raft quorum (tested via `docker node ls`, not ZooKeeper).
#
# This file is a Swarm STACK (docker stack deploy -c ...). Swarm ignores
# `build`, `depends_on`, and Compose `restart:`; use `deploy.*` for replicas,
# placement, resources, restart/update/rollback. Every image below MUST be a
# pinned immutable digest in production (see .env / runtime.lock) — no :latest.
# =============================================================================

version: "3.8"

# ---- Secrets: production uses Docker Swarm secrets (never committed) ------
# Declared `external: true`: create them out-of-band, e.g.
#   printf 'secret' | docker secret create aws_secret_access_key -
# Apps read at /run/secrets/<name>. This is the production secret model;
# development uses docker-compose.yml + .env (Option B separation).
secrets:
  aws_access_key_id:
    external: true
  aws_secret_access_key:
    external: true
  o2_password:
    external: true
  # base64("user:password") for the collector's O2 Basic header — the sh-less
  # collector reads it via the config's file: provider (see config variant).
  o2_auth_basic:
    external: true
  arrow_app_secret:
    external: true
  arrow_password:
    external: true
  arrow_totp_key:
    external: true
  execution_bridge_auth_token:
    external: true
  gateway_shared_secret:
    external: true

# ---- Shared service fragments (YAML anchors) --------------------------------
# P5-011: YAML merge keys are SHALLOW. A service that merges
# `<<: *common_workload` and then defines its own `deploy:` used to REPLACE
# the anchor's whole deploy map — silently dropping restart_policy.window,
# update_config.parallelism/delay/monitor/max_failure_ratio, rollback_config,
# and the default resources. The deploy defaults now live in their own anchor
# so every service merges deploy SUB-KEYS explicitly:
#     deploy:
#       <<: *deploy_workload   # inherits the policies below
#       replicas: ...          # + service-specific overrides
# Sub-map overrides (restart_policy/update_config/placement) still replace
# those maps wholesale — override only what actually differs.
x-deploy-workload: &deploy_workload
  placement:
    constraints: [node.labels.role == worker]
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 4
    window: 120s
  update_config:
    order: start-first
    parallelism: 1
    delay: 10s
    failure_action: rollback
    monitor: 30s
    max_failure_ratio: 0.2
  rollback_config:
    order: stop-first
    parallelism: 1
    delay: 10s
  resources:
    # Explicit reservations/limits — protects manager headroom in v1 (the
    # 2 CPU / 2 GB per-VM manager reservation is enforced by node sizing +
    # these per-container limits, never exceeded past the 85% capacity alert).
    reservations:
      cpus: "0.25"
      memory: 512M
    limits:
      cpus: "4"
      memory: 8G

x-common-workload: &common_workload
  # Workload services run on role=worker nodes. v1: M1-3 carry role=worker
  # (they are Manager+Worker). v2: only W1-3 (+W4...) carry role=worker, so
  # workloads automatically leave the (drained) managers.
  deploy: *deploy_workload

# ---- Networks: encrypted overlay, internal control plane -------------------
# 09 § Security: `trading-net` and `execution-net` SHALL be encrypted overlays.
# `arrow-egress` carries only the broker order-path and is restricted to the
# execution bridge. No host ports on gateway/nautilus/bridge (T8 gate 3).
networks:
  trading-net:
    driver: overlay
    driver_opts:
      encrypted: "true"
  execution-net:
    driver: overlay
    driver_opts:
      encrypted: "true"
    internal: true
  arrow-egress:
    driver: overlay
    driver_opts:
      encrypted: "true"

# ---- Volumes: per-node durable, backed by named volume driver --------------
# G4 Durability T9: flink-checkpoints volume is dev-local only (Compose keeps
# file:///checkpoints). Production checkpoints are encrypted S3 (s3:// / s3a://,
# bucket AES256) — SignalJobConfig fails fast if CHECKPOINT_DIR missing or non-S3
# when DEPLOYMENT_ENV=production or PROFILE=prod; the volume is retained for
# logs only in prod (not durable checkpoints).
volumes:
  zk-data-1:
  zk-data-2:
  zk-data-3:
  fluss-data:
  fluss-remote-data:
  fluss-tablet-data-1:
  fluss-tablet-data-2:
  fluss-tablet-data-3:
  flink-checkpoints:
  flink-logs:
  fluss-logs:
  openobserve-data:
  ingestion-logs:
  # G6 alert routing — durable O2 alert delivery history (alert-consumer).
  alert-store:

# ---- Configs: files mounted into service containers ------------------------
# docker-stack.yml ships the collector config as a Swarm config (the collector
# image is distroless; config must come from an overlay-mounted file, not a
# host bind). The .swarm variant reads O2 creds via ${file:} instead of env.
configs:
  otel-collector-config:
    file: ./otel-collector-config.swarm.yaml
  alert-consumer-src:
    file: ./alert-consumer.py

services:
  # ---- ZooKeeper: 3-member ensemble (quorum 2-of-3), one member per VM ------
  # Production HA target (09 § Storage): three named members, each pinned to a
  # distinct worker via `max_replicas_per_node: 1` + spread. Exactly one member
  # per workload VM — they must never co-locate (anti-co-location). A single
  # member is NOT HA evidence; quorum is only tested on a 3-node rig (M3).
  zookeeper-1:
    image: ${ZOOKEEPER_IMAGE:-zookeeper@sha256:43d39109cbd4de394742efbfc162a8a0a93731e806374b71f3865f4ef4460a56}
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL","zkServer.sh status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    environment:
      ZOO_MY_ID: "1"
      ZOO_SERVERS: "server.1=zookeeper-1:2888:3888;server.2=zookeeper-2:2888:3888;server.3=zookeeper-3:2888:3888"
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
        preferences: [{spread: node.labels.role}]
      restart_policy: {condition: any}
      update_config: {order: start-first, failure_action: rollback}
      resources:
        limits: {cpus: "1", memory: 2G}
    volumes:
      - zk-data-1:/data

  zookeeper-2:
    image: ${ZOOKEEPER_IMAGE:-zookeeper@sha256:43d39109cbd4de394742efbfc162a8a0a93731e806374b71f3865f4ef4460a56}
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL","zkServer.sh status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    environment:
      ZOO_MY_ID: "2"
      ZOO_SERVERS: "server.1=zookeeper-1:2888:3888;server.2=zookeeper-2:2888:3888;server.3=zookeeper-3:2888:3888"
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
        preferences: [{spread: node.labels.role}]
      restart_policy: {condition: any}
      update_config: {order: start-first, failure_action: rollback}
      resources:
        limits: {cpus: "1", memory: 2G}
    volumes:
      - zk-data-2:/data

  zookeeper-3:
    image: ${ZOOKEEPER_IMAGE:-zookeeper@sha256:43d39109cbd4de394742efbfc162a8a0a93731e806374b71f3865f4ef4460a56}
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL","zkServer.sh status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    environment:
      ZOO_MY_ID: "3"
      ZOO_SERVERS: "server.1=zookeeper-1:2888:3888;server.2=zookeeper-2:2888:3888;server.3=zookeeper-3:2888:3888"
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
        preferences: [{spread: node.labels.role}]
      restart_policy: {condition: any}
      update_config: {order: start-first, failure_action: rollback}
      resources:
        limits: {cpus: "1", memory: 2G}
    volumes:
      - zk-data-3:/data

  # ---- Fluss: streaming bus + storage + lake tier --------------------------
  fluss-coordinator:
    <<: *common_workload
    image: ${FLUSS_IMAGE:?set FLUSS_IMAGE to an immutable digest}
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL","(echo > /dev/tcp/127.0.0.1/9123) >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy_workload
      replicas: 1
      resources:
        reservations:
          cpus: "1"
          memory: 2G
        limits:
          cpus: "4"
          memory: 6G
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      FLUSS_COORDINATOR_HOST: fluss-coordinator
      FLUSS_TABLET_HOST: fluss-tablet
      # Credentials arrive via Swarm secrets (read by app from /run/secrets).
      # See app config for the secret-file env wiring.
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
        bind.listeners: INTERNAL://fluss-coordinator:0,CLIENT://fluss-coordinator:9123
        advertised.listeners: CLIENT://fluss-coordinator:9123
        internal.listener.name: INTERNAL
        remote.data.dir: /tmp/fluss/remote-data
        datalake.format: ${DATALAKE_FORMAT:-iceberg}
        datalake.iceberg.type: hadoop
        datalake.iceberg.warehouse: ${S3_WAREHOUSE_PATH:?set S3_WAREHOUSE_PATH for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint: ${R2_ENDPOINT:?set R2_ENDPOINT for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint.region: ${AWS_REGION:-auto}
        datalake.iceberg.iceberg.hadoop.fs.s3a.path.style.access: "true"
        datalake.iceberg.iceberg.hadoop.fs.s3.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.timeout: 30000
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.establish.timeout: 30000
    volumes:
      - fluss-data:/data
      - fluss-remote-data:/tmp/fluss/remote-data
      - fluss-logs:/opt/fluss/log

  # ---- Fluss tablet servers (P5-001) ----------------------------------------
  # CRITICAL fix: a single `fluss-tablet` service with replicas: 3 shared ONE
  # service spec — all three tablet servers booted with identical identity
  # (tablet-server.id: 0, bind/advertised listeners on hostname fluss-tablet),
  # breaking log replication/failover (server identity must be unique, like
  # zookeeper-1/2/3). Split into three pinned services with distinct ids
  # (1/2/3) and listener hostnames. Data volumes are per-server (a shared
  # fluss-tablet-data would corrupt); fluss-data/fluss-remote-data stay shared
  # (lake-snapshot offset contract, PROD-013).
  # Residue: co-location — tablet-1/2/3 each allow any worker (max_replicas_
  # per_node is per-service), so two tablets MAY share a node; the hard
  # guarantee is pinning via node.labels.fluss_tablet == N constraints once
  # nodes are labeled (same out-of-band model as role/observability labels).
  fluss-tablet-1:
    <<: *common_workload
    image: ${FLUSS_IMAGE:?set FLUSS_IMAGE to an immutable digest}
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL","(echo > /dev/tcp/127.0.0.1/9124) >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy_workload
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
      resources:
        reservations: {cpus: "1", memory: 2G}
        limits: {cpus: "4", memory: 6G}
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      FLUSS_COORDINATOR_HOST: fluss-coordinator
      FLUSS_TABLET_HOST: fluss-tablet-1
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
        bind.listeners: INTERNAL://fluss-tablet-1:0, CLIENT://fluss-tablet-1:9124
        advertised.listeners: CLIENT://fluss-tablet-1:9124
        internal.listener.name: INTERNAL
        tablet-server.id: 1
        kv.snapshot.interval: 0s
        data.dir: /tmp/fluss/data
        remote.data.dir: /tmp/fluss/remote-data
        datalake.format: ${DATALAKE_FORMAT:-iceberg}
        datalake.iceberg.type: hadoop
        datalake.iceberg.warehouse: ${S3_WAREHOUSE_PATH:?set S3_WAREHOUSE_PATH for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint: ${R2_ENDPOINT:?set R2_ENDPOINT for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint.region: ${AWS_REGION:-auto}
        datalake.iceberg.iceberg.hadoop.fs.s3a.path.style.access: "true"
        datalake.iceberg.iceberg.hadoop.fs.s3.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.timeout: 30000
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.establish.timeout: 30000
    volumes:
      - fluss-data:/data
      - fluss-remote-data:/tmp/fluss/remote-data
      - fluss-tablet-data-1:/tmp/fluss/data
      - fluss-logs:/opt/fluss/log

  fluss-tablet-2:
    <<: *common_workload
    image: ${FLUSS_IMAGE:?set FLUSS_IMAGE to an immutable digest}
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL","(echo > /dev/tcp/127.0.0.1/9124) >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy_workload
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
      resources:
        reservations: {cpus: "1", memory: 2G}
        limits: {cpus: "4", memory: 6G}
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      FLUSS_COORDINATOR_HOST: fluss-coordinator
      FLUSS_TABLET_HOST: fluss-tablet-2
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
        bind.listeners: INTERNAL://fluss-tablet-2:0, CLIENT://fluss-tablet-2:9124
        advertised.listeners: CLIENT://fluss-tablet-2:9124
        internal.listener.name: INTERNAL
        tablet-server.id: 2
        kv.snapshot.interval: 0s
        data.dir: /tmp/fluss/data
        remote.data.dir: /tmp/fluss/remote-data
        datalake.format: ${DATALAKE_FORMAT:-iceberg}
        datalake.iceberg.type: hadoop
        datalake.iceberg.warehouse: ${S3_WAREHOUSE_PATH:?set S3_WAREHOUSE_PATH for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint: ${R2_ENDPOINT:?set R2_ENDPOINT for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint.region: ${AWS_REGION:-auto}
        datalake.iceberg.iceberg.hadoop.fs.s3a.path.style.access: "true"
        datalake.iceberg.iceberg.hadoop.fs.s3.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.timeout: 30000
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.establish.timeout: 30000
    volumes:
      - fluss-data:/data
      - fluss-remote-data:/tmp/fluss/remote-data
      - fluss-tablet-data-2:/tmp/fluss/data
      - fluss-logs:/opt/fluss/log

  fluss-tablet-3:
    <<: *common_workload
    image: ${FLUSS_IMAGE:?set FLUSS_IMAGE to an immutable digest}
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL","(echo > /dev/tcp/127.0.0.1/9124) >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy_workload
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
      resources:
        reservations: {cpus: "1", memory: 2G}
        limits: {cpus: "4", memory: 6G}
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      FLUSS_COORDINATOR_HOST: fluss-coordinator
      FLUSS_TABLET_HOST: fluss-tablet-3
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
        bind.listeners: INTERNAL://fluss-tablet-3:0, CLIENT://fluss-tablet-3:9124
        advertised.listeners: CLIENT://fluss-tablet-3:9124
        internal.listener.name: INTERNAL
        tablet-server.id: 3
        kv.snapshot.interval: 0s
        data.dir: /tmp/fluss/data
        remote.data.dir: /tmp/fluss/remote-data
        datalake.format: ${DATALAKE_FORMAT:-iceberg}
        datalake.iceberg.type: hadoop
        datalake.iceberg.warehouse: ${S3_WAREHOUSE_PATH:?set S3_WAREHOUSE_PATH for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint: ${R2_ENDPOINT:?set R2_ENDPOINT for lake tiering}
        datalake.iceberg.iceberg.hadoop.fs.s3a.endpoint.region: ${AWS_REGION:-auto}
        datalake.iceberg.iceberg.hadoop.fs.s3a.path.style.access: "true"
        datalake.iceberg.iceberg.hadoop.fs.s3.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.timeout: 30000
        datalake.iceberg.iceberg.hadoop.fs.s3a.connection.establish.timeout: 30000
    volumes:
      - fluss-data:/data
      - fluss-remote-data:/tmp/fluss/remote-data
      - fluss-tablet-data-3:/tmp/fluss/data
      - fluss-logs:/opt/fluss/log

  # ---- Flink: compute (signal + babysitter jobs) ----------------------------
  # Production HA: Flink JobManager HA via ZooKeeper (`high-availability.type:
  # zookeeper`), checkpoints in encrypted S3 (G4 T9: production requires
  # CHECKPOINT_DIR=s3:// or s3a:// with bucket AES256; SignalJobConfig fails fast
  # if missing/non-S3 when DEPLOYMENT_ENV=production or PROFILE=prod; dev keeps
  # local volume file:///checkpoints), standby JMs. This is Flink-level
  # HA — separate from Swarm Raft (09 § Storage and recovery). Placement allows
  # future workers; Flink TaskManager slots are Flink's own parallelism, not
  # Swarm replicas.
  flink-jobmanager:
    <<: *common_workload
    image: ${FLINK_IMAGE:?set FLINK_IMAGE to an immutable digest}
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL","(echo > /dev/tcp/127.0.0.1/8081) >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy_workload
      replicas: 2                      # standby JM; one promoted on failure
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
        preferences:
          - spread: node.labels.role
      resources:
        reservations: {cpus: "1", memory: 2G}
        limits: {cpus: "4", memory: 4G}
    environment:
      # G4 Durability T9: production checkpoint storage — encrypted S3 mandatory.
      # Swarm enforces s3:// via mandatory variable expansion; the job itself
      # (SignalJobConfig) also fails fast with a clear message if CHECKPOINT_DIR
      # missing or not s3:// when DEPLOYMENT_ENV=production or PROFILE=prod.
      # Dev never needs S3: compose uses file:///checkpoints local volume.
      DEPLOYMENT_ENV: production
      PROFILE: ${PROFILE:-production}
      CHECKPOINT_DIR: ${CHECKPOINT_DIR:?set CHECKPOINT_DIR to an encrypted s3:// URI - prod requires s3://<bucket>/flink-checkpoints (G4 T9, encrypted S3 mandatory)}
      SAVEPOINT_DIR: ${SAVEPOINT_DIR:-${CHECKPOINT_DIR}}
      # S3/R2 endpoint + credentials arrive via Swarm secrets/env injection.
      # The job's SignalJobConfig.s3Endpoint validates S3_ENDPOINT (or R2_ENDPOINT)
      # + AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY when CHECKPOINT_DIR is s3://.
      S3_ENDPOINT: ${S3_ENDPOINT:-${R2_ENDPOINT:-}}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
      # Streaming-3000 T3 G3 Compute (p=8, 16 buckets → 8 slots, hash(token) 2:1)
      PARALLELISM: ${PARALLELISM:-8}
      STATE_BACKEND: rocksdb
      STATE_BACKEND_LOCAL_DIRS: ${STATE_BACKEND_LOCAL_DIRS:-/tmp/flink-rocksdb}
      STATE_BACKEND_MANAGED_MEMORY: "true"
      TASK_MANAGER_NETWORK_MEMORY_MAX: 256m
      TASK_MANAGER_MEMORY_MANAGED_SIZE: ${TASK_MANAGER_MEMORY_MANAGED_SIZE:-}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        high-availability.type: zookeeper
        high-availability.zookeeper.quorum: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
        high-availability.storageDir: ${S3_WAREHOUSE_PATH:?set S3_WAREHOUSE_PATH}
        high-availability.zookeeper.path.root: /flink
        high-availability.cluster-id: ${FLINK_CLUSTER_ID:-prod}
        # REQ-FC-008: max 3 restart attempts at 30s pause, reject unbounded retry.
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 30 s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        metrics.reporter.prom.interval: 15 SECONDS
        metrics.latency.interval: 5000
        taskmanager.numberOfTaskSlots: 8
        jobmanager.memory.process.size: 1600m
        taskmanager.memory.process.size: 3g
        taskmanager.memory.task.off-heap.size: 512m
        # Streaming-3000 T3 G3 Compute: p=8 RocksDB incremental on SSD, managed 0.4, network 256m
        taskmanager.memory.managed.fraction: 0.4
        taskmanager.memory.network.max: 256m
        taskmanager.memory.network.min: 256m
        # G4 T9: durable encrypted checkpoint store (cluster-level fallback;
        # the job also sets CheckpointingOptions.CHECKPOINTS_DIRECTORY from
        # CHECKPOINT_DIR env via SignalJobConfig -> Configuration).
        state.checkpoints.dir: ${CHECKPOINT_DIR:?set CHECKPOINT_DIR to an encrypted s3:// URI}
        state.savepoints.dir: ${SAVEPOINT_DIR:-${CHECKPOINT_DIR}}
        state.backend: rocksdb
        state.backend.incremental: "true"
        state.backend.rocksdb.localdir: /tmp/flink-rocksdb
        fs.s3a.server-side-encryption-algorithm: AES256
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      # Prod wiring for Position_State handshake (Option B, Position_State DDL 29):
      # Swarm must be explicit — compose resolves fluss-coordinator via DNS,
      # SignalJobConfig accepts either FLUSS_BOOTSTRAP_SERVERS or the alias
      # FLUSS_BOOTSTRAP (explicit SERVERS wins). POSITION_STATE_TABLE pins the
      # DDL 29 table so DDL drift is caught at `docker stack config` time.
      FLUSS_BOOTSTRAP_SERVERS: ${FLUSS_BOOTSTRAP_SERVERS:-${FLUSS_BOOTSTRAP:-fluss-coordinator:9123}}
      FLUSS_DATABASE: ${FLUSS_DATABASE:-default}
      POSITION_STATE_TABLE: ${POSITION_STATE_TABLE:-Position_State}
    volumes:
      - flink-checkpoints:/checkpoints
      - flink-logs:/opt/flink/log
    secrets:
      - aws_access_key_id
      - aws_secret_access_key

  flink-taskmanager:
    # x-healthcheck: none (no fixed external listener; worker liveness/slot health is
    # inferred from the JobManager REST 8081 probe + app-level slot allocation).
    <<: *common_workload
    image: ${FLINK_IMAGE:?set FLINK_IMAGE to an immutable digest}
    networks: [trading-net]
    deploy:
      <<: *deploy_workload
      replicas: 3                      # one TM per worker in v2; scales with W4+
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
        preferences:
          - spread: node.labels.role
      # Future workers: add W4+ labels, increase replicas — no stack rewrite.
      resources:
        reservations: {cpus: "1", memory: 3G}
        limits: {cpus: "6", memory: 12G}
    environment:
      # G4 Durability T9: mirror JM checkpoint contract on TMs (same S3 vars).
      DEPLOYMENT_ENV: production
      PROFILE: ${PROFILE:-production}
      CHECKPOINT_DIR: ${CHECKPOINT_DIR:?set CHECKPOINT_DIR to an encrypted s3:// URI - prod requires s3://<bucket>/flink-checkpoints (G4 T9)}
      SAVEPOINT_DIR: ${SAVEPOINT_DIR:-${CHECKPOINT_DIR}}
      S3_ENDPOINT: ${S3_ENDPOINT:-${R2_ENDPOINT:-}}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
      # Streaming-3000 T3 G3 Compute (p=8, 16 buckets → 8 slots)
      PARALLELISM: ${PARALLELISM:-8}
      STATE_BACKEND: rocksdb
      STATE_BACKEND_LOCAL_DIRS: ${STATE_BACKEND_LOCAL_DIRS:-/tmp/flink-rocksdb}
      STATE_BACKEND_MANAGED_MEMORY: "true"
      TASK_MANAGER_NETWORK_MEMORY_MAX: 256m
      TASK_MANAGER_MEMORY_MANAGED_SIZE: ${TASK_MANAGER_MEMORY_MANAGED_SIZE:-}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 8
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        metrics.reporter.prom.interval: 15 SECONDS
        taskmanager.memory.process.size: 3g
        taskmanager.memory.task.off-heap.size: 512m
        taskmanager.memory.managed.fraction: 0.4
        taskmanager.memory.network.max: 256m
        taskmanager.memory.network.min: 256m
        state.checkpoints.dir: ${CHECKPOINT_DIR:?set CHECKPOINT_DIR to an encrypted s3:// URI}
        state.savepoints.dir: ${SAVEPOINT_DIR:-${CHECKPOINT_DIR}}
        state.backend: rocksdb
        state.backend.incremental: "true"
        state.backend.rocksdb.localdir: /tmp/flink-rocksdb
        fs.s3a.server-side-encryption-algorithm: AES256
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      # Prod wiring for Position_State handshake (Option B, DDL 29) — mirrors JM.
      FLUSS_BOOTSTRAP_SERVERS: ${FLUSS_BOOTSTRAP_SERVERS:-${FLUSS_BOOTSTRAP:-fluss-coordinator:9123}}
      FLUSS_DATABASE: ${FLUSS_DATABASE:-default}
      POSITION_STATE_TABLE: ${POSITION_STATE_TABLE:-Position_State}
    volumes:
      - flink-checkpoints:/checkpoints
      - flink-logs:/opt/flink/log
    secrets:
      - aws_access_key_id
      - aws_secret_access_key

  # ---- Ingestion ------------------------------------------------------------
  ingestion:
    <<: *common_workload
    image: ${INGESTION_IMAGE:?set INGESTION_IMAGE to an immutable digest}
    networks: [trading-net]
    deploy:
      <<: *deploy_workload
      replicas: 1
      resources:
        limits: {cpus: "4", memory: 4G}
    secrets:
      - arrow_app_secret
      - arrow_password
      - arrow_totp_key
    environment:
      # P1-077: stack is the prod deploy — prod gates engaged.
      DEPLOYMENT_ENV: production
      # T6: proto is THE transport (CHG-115; NDJSON pipe removed 2026-08-29).
      # TRANSPORT=proto|grpc only; anything else is FATAL in the bridge.
      TRANSPORT: ${TRANSPORT:-proto}
      ARROW_APP_ID: ${ARROW_APP_ID:?set ARROW_APP_ID}
      ARROW_USER_ID: ${ARROW_USER_ID:?set ARROW_USER_ID}
      ARROW_INSTRUMENT_TOKENS: ${ARROW_INSTRUMENT_TOKENS:-}
      ARROW_DEBUG_WS: ${ARROW_DEBUG_WS:-}
      ARROW_TICK_COUNTS: ${ARROW_TICK_COUNTS:-}
      ARROW_TICK_COUNTS_FILE: ${ARROW_TICK_COUNTS_FILE:-/tmp/arrow-tick-counts.txt}
      ARROW_HFT_LATENCY_MS: ${ARROW_HFT_LATENCY_MS:-50}
      # T0 3-slot (streaming-3000): env-driven slot count N=1..3. Default 1
      # keeps single-socket 1024 working; N=3 shards a single CSV (3000 rows)
      # as 1024+1024+952 via BuildSubscriptionPlan contiguous chunks.
      # Go/Java both enforce 1..3 (hftRange/intRange). Swarm image must bake
      # manifests under /instruments; for N=3 bake the single 3000-row CSV
      # and set ARROW_HFT_CONNECTIONS=3 (auto-shard). A per-slot CSV list
      # env (the plural form of ARROW_INSTRUMENT_MANIFEST) was an unbuilt
      # T1 alternative — removed 2026-09-09, P5-012 (no reader;
      # auto-shard supersedes).
      ARROW_HFT_CONNECTIONS: ${ARROW_HFT_CONNECTIONS:-1}
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      INSTRUMENT_MANIFEST_PATH: ${INSTRUMENT_MANIFEST_PATH:-/instruments/NSE_CM_EQUITY.csv}
      ARROW_INSTRUMENT_MANIFEST: ${ARROW_INSTRUMENT_MANIFEST:-/instruments/NSE_CM_EQUITY.csv}
      RAW_TABLE_NAME: ${RAW_TABLE_NAME:-raw_table_1}
      ARROW_MAX_EVENT_AGE_MS: ${ARROW_MAX_EVENT_AGE_MS:-5000}
      ARROW_MAX_FUTURE_EVENT_SKEW_MS: ${ARROW_MAX_FUTURE_EVENT_SKEW_MS:-2000}
      CLOCK_OFFSET_LIMIT_MS: ${CLOCK_OFFSET_LIMIT_MS:-2000}
      # T2 tunable backpressure (G2 Ingest) — streaming-3000: 50k/64M (1k) → 150k/192M (3k)
      # Primary: MAX_PENDING_APPEND_* + PENDING_APPEND_WARNING_PERCENT (80% warn / 100% halt).
      # Aliases: PENDING_MAX_RECORDS / PENDING_MAX_BYTES / PENDING_WARNING_PERCENT (primary wins).
      # Prod 3k defaults: 150k records / 192MiB. Override for 1k: 50000 / 67108864.
      MAX_PENDING_APPEND_RECORDS: ${MAX_PENDING_APPEND_RECORDS:-150000}
      MAX_PENDING_APPEND_BYTES: ${MAX_PENDING_APPEND_BYTES:-201326592}
      PENDING_APPEND_WARNING_PERCENT: ${PENDING_APPEND_WARNING_PERCENT:-0.80}
      PENDING_MAX_RECORDS: ${PENDING_MAX_RECORDS:-}
      PENDING_MAX_BYTES: ${PENDING_MAX_BYTES:-}
      PENDING_WARNING_PERCENT: ${PENDING_WARNING_PERCENT:-}
      READINESS_FILE_PATH: /tmp/ingestion.ready
      LOG_DIR: /data/ingestion/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ingestion.ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    volumes:
      - ingestion-logs:/data/ingestion/logs

  # ---- T3 execution bridge (fake/disabled locally; never live Arrow) --------
  execution-bridge:
    <<: *common_workload
    image: ${EXECUTION_BRIDGE_IMAGE:?set EXECUTION_BRIDGE_IMAGE to an immutable digest}
    networks: [execution-net, arrow-egress]
    deploy:
      <<: *deploy_workload
      replicas: 1
      resources:
        limits: {cpus: "1", memory: 1G}
    secrets:
      - execution_bridge_auth_token
    environment:
      # P5-013: the secret is a FILE — the bridge resolves it natively via
      # the _FILE pattern (main.go authTokenFromEnv; direct env still works
      # for non-secret deploys). /healthz stays unauthenticated by design —
      # only /command and /events require the Bearer token.
      EXECUTION_BRIDGE_AUTH_TOKEN_FILE: /run/secrets/execution_bridge_auth_token
      EXECUTION_BRIDGE_MODE: ${EXECUTION_BRIDGE_MODE:-disabled}
      EXECUTION_BRIDGE_LISTEN_ADDR: 0.0.0.0:8787
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---- T8 execution topology (private, zero host ports) ---------------------
  execution-gateway:
    # x-healthcheck: none (GATEWAY_BIND_PORT env-driven, no fixed port) — readiness is the
    # app-level GatewayReadiness gate (gateway must be ready before nautilus trades).
    image: ${EXECUTION_GATEWAY_IMAGE:?set EXECUTION_GATEWAY_IMAGE to an immutable digest}
    networks: [trading-net, execution-net]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
      restart_policy: {condition: any}
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits: {cpus: "2", memory: 2G}
    secrets:
      - gateway_shared_secret
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      GATEWAY_BIND_HOST: 0.0.0.0
      GATEWAY_BIND_PORT: "9180"
      NAUTILUS_PRIVATE_ENDPOINT: http://nautilus:9190/v1/intents
      GATEWAY_PROTOCOL_VERSION: execution-gateway.v1
      ACCOUNT_SCOPE_ID: ${ACCOUNT_SCOPE_ID:-prod-scope}
      EXECUTION_PARTITION_ID: ${EXECUTION_PARTITION_ID:-prod-partition}
      GATEWAY_REQUEST_TIMEOUT_MS: "2000"
      GATEWAY_POLL_TIMEOUT_MS: "250"

  nautilus:
    # x-healthcheck: none (EXECUTOR_LISTEN_ADDR is env-driven, no fixed port) — executor
    # liveness/ownership is app-level fencing (one active owner per execution_partition_id).
    image: ${NAUTILUS_IMAGE:?set NAUTILUS_IMAGE to an immutable digest}
    networks: [execution-net]
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      placement:
        constraints: [node.labels.role == worker]
        # Executor fencing: exactly one active owner per execution_partition_id
      restart_policy: {condition: any}
      resources:
        limits: {cpus: "2", memory: 2G}
    secrets:
      - gateway_shared_secret
    environment:
      EXECUTION_ENABLED: "false"         # live-money disabled until all gates pass
      EXECUTOR_LISTEN_ADDR: 0.0.0.0:9190
      BRIDGE_ENDPOINT: http://execution-bridge:8787
      # CHG-079 (2026-08-21): BRIDGE_ENDPOINT now selects the production HttpBridgeClient
      # transport. Bridge side is wired (P5-013): the bridge reads the Swarm
      # secret via EXECUTION_BRIDGE_AUTH_TOKEN_FILE. THIS service still needs
      # BRIDGE_AUTH_TOKEN from the same secret before execution can be enabled —
      # the Rust executor reads plain env only, so it needs its own _FILE (or
      # wrapper) support; open P3 work. Gate stays HALTED (EXECUTION_ENABLED
      # false) so no command ever flows meanwhile.
      GATEWAY_ENDPOINT: http://execution-gateway:9180
      GATEWAY_PROTOCOL_VERSION: execution-gateway.v1

  # ---- Observability (VM4 / O1: outside Swarm, not a scheduling dependency) -
  # In production O1 is a dedicated host (not part of the manager quorum). If O1
  # joins Swarm as a Worker, these services pin to `observability == true` so they
  # never take core workload capacity; openobserve loss must never authorize
  # orders or erase durable audit (OPS-FAIL-001).
  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:e39311df1f3d941923c00da79ac7ba6269124a870ee87e3c3ad24d60f8aee4d2
    networks: [trading-net]
    command: ["--config=/etc/otel-collector-config.yaml"]
    deploy:
      mode: global
      placement:
        constraints: [node.labels.observability == true]
      restart_policy: {condition: any}
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits: {cpus: "2", memory: 2G}
    secrets:
      - o2_auth_basic
    configs:
      - source: otel-collector-config
        target: /etc/otel-collector-config.yaml
    volumes:
      - ingestion-logs:/data/ingestion/logs:ro
      - flink-logs:/data/flink/logs:ro
      - fluss-logs:/data/fluss/logs:ro

  openobserve:
    image: ${OPENOBSERVE_IMAGE:?set OPENOBSERVE_IMAGE to an immutable digest}
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL","(echo > /dev/tcp/127.0.0.1/5080) >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      replicas: 1
      placement:
        constraints: [node.labels.observability == true]
      restart_policy: {condition: any}
      resources:
        limits: {cpus: "4", memory: 8G}
    secrets:
      - o2_password
    environment:
      ZO_ROOT_USER_EMAIL: ${O2_USER:-admin@example.com}
      ZO_MAX_FILE_RETENTION_TIME: ${ZO_MAX_FILE_RETENTION_TIME:-3600}
      ZO_MAX_FILE_SIZE_ON_DISK: ${ZO_MAX_FILE_SIZE_ON_DISK:-128}
      ZO_MAX_FILE_SIZE_IN_MEMORY: ${ZO_MAX_FILE_SIZE_IN_MEMORY:-128}
    volumes:
      - openobserve-data:/data

  alert-consumer:
    # G6 alert routing — persistent single-webhook consumer (dev twin:
    # docker-compose.yml alert-consumer; CHG-093 stdout receiver retired).
    # x-healthcheck: none (stateless ingress; port is set in-app, restart policy covers
    # liveness; its correctness is tested by webhook dispatch unit tests).
    # NOTE (fixed 2026-08-31): the predecessor service ran
    # /app/webhook-receiver.py with NO mount of that file — it would have
    # crash-looped on this stack; the script now ships as a Swarm config.
    image: python@sha256:9c900dea9e8fb7e16277c179b555cc72d29a352dbc33cff48ad5a0412fd5bfc7
    networks: [trading-net]
    configs:
      - source: alert-consumer-src
        target: /app/alert-consumer.py
    volumes:
      - alert-store:/data/alerts
    environment:
      # Swarm: O2 and the consumer are separate netns — the destination URL
      # must be http://alert-consumer:9999/noop (service DNS), NOT localhost,
      # and the consumer must bind the overlay interface, not loopback.
      ALERT_CONSUMER_PORT: "9999"
      ALERT_BIND: "0.0.0.0"
    deploy:
      # P5-011 residue fix: stateful (alert-store volume) — inherit the
      # common update/rollback policies; placement stays observability-pinned.
      <<: *deploy_workload
      replicas: 1
      placement:
        constraints: [node.labels.observability == true]
      resources:
        limits: {cpus: "1", memory: 512M}
    command: ["python3", "/app/alert-consumer.py"]
