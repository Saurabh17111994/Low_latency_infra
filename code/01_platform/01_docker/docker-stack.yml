  # ---- Flink: compute (signal + babysitter jobs) ----------------------------
  # Production HA: Flink JobManager HA via ZooKeeper (`high-availability.type:
  # zookeeper`), checkpoints in encrypted S3 (G4 T9: production requires
  # CHECKPOINT_DIR=s3:// or s3a:// with bucket AES256; SignalJobConfig fails fast
  # if missing/non-S3 when DEPLOYMENT_ENV=production or PROFILE=prod; dev keeps
  # local volume file:///checkpoints), standby JMs. This is Flink-level
  # HA — separate from Swarm Raft (09 § Storage and recovery). Placement allows
  # future workers; Flink TaskManager slots are Flink's own parallelism, not
  # Swarm replicas.
  flink-jobmanager:
    <<: *common_workload
    image: ${FLINK_IMAGE:?set FLINK_IMAGE to an immutable digest}
    networks: [trading-net]
    # What this container runs. Verified 2026-09-16: the image's own default
    # CMD is only the usage/help path, so a service with NO command prints
    # usage and exits 0 — Swarm then reports the task as started while nothing
    # runs. These must stay explicit.
    command: ["jobmanager"]
    healthcheck:
      # CHG-181 sibling: CMD-SHELL is dash (no /dev/tcp); probe
      # $HOSTNAME under bash, loopback as fallback.
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/$$HOSTNAME/8081 || echo > /dev/tcp/127.0.0.1/8081) >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy_workload
      replicas: 2                      # standby JM; one promoted on failure
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
        preferences:
          - spread: node.labels.role
      resources:
        reservations: {cpus: "1", memory: 2G}
        limits: {cpus: "4", memory: 4G}
    environment:
      # G4 Durability T9: production checkpoint storage — encrypted S3 mandatory.
      # Swarm enforces s3:// via mandatory variable expansion; the job itself
      # (SignalJobConfig) also fails fast with a clear message if CHECKPOINT_DIR
      # missing or not s3:// when DEPLOYMENT_ENV=production or PROFILE=prod.
      # Dev never needs S3: compose uses file:///checkpoints local volume.
      DEPLOYMENT_ENV: production
      PROFILE: ${PROFILE:-production}
      # Production: s3://<bucket>/flink-checkpoints (G4 T9, encrypted S3 mandatory).
      # CHG-252: the :? text must not contain ' - ' and defaults must not nest -
      # both render as garbage/literal on this docker (probe-verified).
      CHECKPOINT_DIR: ${CHECKPOINT_DIR:?set CHECKPOINT_DIR to an encrypted s3:// URI}
      SAVEPOINT_DIR: ${CHECKPOINT_DIR:?set CHECKPOINT_DIR to an encrypted s3:// URI}
      # S3/R2 endpoint + credentials arrive via Swarm secrets/env injection.
      # The job's SignalJobConfig.s3Endpoint validates S3_ENDPOINT (or R2_ENDPOINT)
      # + AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY when CHECKPOINT_DIR is s3://.
      # CHG-252: collapsed - the nested form rendered literal; S3_ENDPOINT was
      # never set independently, so it is R2 (empty-default :- is probe-safe).
      S3_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      # The baked /etc/hadoop/conf/core-site.xml expands ${env.AWS_REGION} into
      # fs.s3a.endpoint.region. Verified 2026-09-16: with the region unset, S3A
      # requests fail 400 Bad Request; R2 answers 'auto' (compose uses the same
      # default for its FLUSS_PROPERTIES s3.endpoint.region).
      AWS_REGION: ${AWS_REGION:-auto}
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
      # Streaming-3000 T3 G3 Compute (p=8, 16 buckets → 8 slots, hash(token) 2:1)
      PARALLELISM: ${PARALLELISM:-8}
      STATE_BACKEND: rocksdb
      STATE_BACKEND_LOCAL_DIRS: ${STATE_BACKEND_LOCAL_DIRS:-/tmp/flink-rocksdb}
      STATE_BACKEND_MANAGED_MEMORY: "true"
      TASK_MANAGER_NETWORK_MEMORY_MAX: 256m
      TASK_MANAGER_MEMORY_MANAGED_SIZE: ${TASK_MANAGER_MEMORY_MANAGED_SIZE:-}
      # CHG-252: savepoints = checkpoints directly (the nested CHECKPOINT_DIR
      # form never rendered - Flink cannot parse a literal reference).
      # NOTE: no prose comments inside this block - the Flink entrypoint loads
      # every line as a property (run8c: a '#' line showed up as a config key).
      # (Block docs hoisted here from inside: REQ-FC-008 restart policy,
      # Streaming-3000 T3 G3 compute sizing, G4 T9 checkpoint store.)
      # REQ-FC-008: max 3 restart attempts at 30s pause, reject unbounded retry.
      # Streaming-3000 T3 G3 Compute: p=8 RocksDB incremental on SSD, managed 0.4, network 256m
      # G4 T9: durable encrypted checkpoint store (cluster-level fallback;
      # the job also sets CheckpointingOptions.CHECKPOINTS_DIRECTORY from
      # CHECKPOINT_DIR env via SignalJobConfig -> Configuration).
      # CHG-253: Flink 2.x splits the advertised RPC port from the bound one.
      # jobmanager.rpc.port is what peers dial; jobmanager.rpc.bind-port defaults
      # to 0 ("any free port"), so run8f listened on a random port while every
      # TaskManager dialled 6123 and timed out - the JM looked healthy throughout.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.rpc.bind-port: 6123
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        high-availability.type: zookeeper
        high-availability.zookeeper.quorum: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
        high-availability.storageDir: ${S3_WAREHOUSE_PATH:?set S3_WAREHOUSE_PATH}
        high-availability.zookeeper.path.root: /flink
        high-availability.cluster-id: ${FLINK_CLUSTER_ID:-prod}
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 30 s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        metrics.reporter.prom.interval: 15 SECONDS
        metrics.latency.interval: 5000
        taskmanager.numberOfTaskSlots: 8
        jobmanager.memory.process.size: 1600m
        taskmanager.memory.process.size: 3g
        taskmanager.memory.task.off-heap.size: 512m
        taskmanager.memory.managed.fraction: 0.4
        taskmanager.memory.network.max: 256m
        taskmanager.memory.network.min: 256m
        state.checkpoints.dir: ${CHECKPOINT_DIR:?set CHECKPOINT_DIR to an encrypted s3:// URI}
        state.savepoints.dir: ${CHECKPOINT_DIR:?set CHECKPOINT_DIR to an encrypted s3:// URI}
        state.backend: rocksdb
        state.backend.incremental: "true"
        state.backend.rocksdb.localdir: /tmp/flink-rocksdb
        fs.s3a.server-side-encryption-algorithm: AES256
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      # Prod wiring for Position_State handshake (Option B, Position_State DDL 29):
      # Swarm must be explicit — compose resolves fluss-coordinator via DNS,
      # SignalJobConfig accepts either FLUSS_BOOTSTRAP_SERVERS or the alias
      # FLUSS_BOOTSTRAP (explicit SERVERS wins). POSITION_STATE_TABLE pins the
      # DDL 29 table so DDL drift is caught at `docker stack config` time.
      # CHG-252: literal - the nested form rendered literal, and a plain
      # ${FLUSS_BOOTSTRAP} reads the deploy env, NOT the sibling key two lines
      # up (interpolation is env-only). Keep in sync with FLUSS_BOOTSTRAP.
      FLUSS_BOOTSTRAP_SERVERS: fluss-coordinator:9123
      FLUSS_DATABASE: ${FLUSS_DATABASE:-default}
      POSITION_STATE_TABLE: ${POSITION_STATE_TABLE:-Position_State}
    volumes:
      - flink-checkpoints:/checkpoints
      - flink-logs:/opt/flink/log
    secrets:
      - aws_access_key_id
      - aws_secret_access_key

  flink-taskmanager:
    # x-healthcheck: none (no fixed external listener; worker liveness/slot health is
    # inferred from the JobManager REST 8081 probe + app-level slot allocation).
    <<: *common_workload
    image: ${FLINK_IMAGE:?set FLINK_IMAGE to an immutable digest}
    networks: [trading-net]
    # What this container runs. Verified 2026-09-16: the image's own default
    # CMD is only the usage/help path, so a service with NO command prints
    # usage and exits 0 — Swarm then reports the task as started while nothing
    # runs. These must stay explicit.
    command: ["taskmanager"]
    deploy:
      <<: *deploy_workload
      replicas: 3                      # one TM per worker in v2; scales with W4+
      placement:
        constraints: [node.labels.role == worker]
        max_replicas_per_node: 1
        preferences:
          - spread: node.labels.role
      # Future workers: add W4+ labels, increase replicas — no stack rewrite.
      resources:
        reservations: {cpus: "1", memory: 3G}
        limits: {cpus: "6", memory: 12G}
    environment:
      # G4 Durability T9: mirror JM checkpoint contract on TMs (same S3 vars).
      DEPLOYMENT_ENV: production
      PROFILE: ${PROFILE:-production}
      # Production: s3://<bucket>/flink-checkpoints (G4 T9).
      # CHG-252: the :? text must not contain ' - ' and defaults must not nest -
      # both render as garbage/literal on this docker (probe-verified).
      CHECKPOINT_DIR: ${CHECKPOINT_DIR:?set CHECKPOINT_DIR to an encrypted s3:// URI}
      SAVEPOINT_DIR: ${CHECKPOINT_DIR:?set CHECKPOINT_DIR to an encrypted s3:// URI}
      # CHG-252: collapsed to R2 (see JM - S3_ENDPOINT was never set alone).
      S3_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      # The baked /etc/hadoop/conf/core-site.xml expands ${env.AWS_REGION} into
      # fs.s3a.endpoint.region. Verified 2026-09-16: with the region unset, S3A
      # requests fail 400 Bad Request; R2 answers 'auto' (compose uses the same
      # default for its FLUSS_PROPERTIES s3.endpoint.region).
      AWS_REGION: ${AWS_REGION:-auto}
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
      # Streaming-3000 T3 G3 Compute (p=8, 16 buckets → 8 slots)
      PARALLELISM: ${PARALLELISM:-8}
      STATE_BACKEND: rocksdb
      STATE_BACKEND_LOCAL_DIRS: ${STATE_BACKEND_LOCAL_DIRS:-/tmp/flink-rocksdb}
      STATE_BACKEND_MANAGED_MEMORY: "true"
      TASK_MANAGER_NETWORK_MEMORY_MAX: 256m
      TASK_MANAGER_MEMORY_MANAGED_SIZE: ${TASK_MANAGER_MEMORY_MANAGED_SIZE:-}
      # CHG-252: savepoints = checkpoints directly (nested rendered literal).
      # (Same no-prose-inside rule as the jobmanager block above.)
      # CHG-253: same bind/advertise split as the jobmanager - the ResourceManager
      # dials the TaskManager's advertised taskmanager.rpc.port, so the bound port
      # must be that same fixed port.
      # CHG-255: the HA keys below are needed by BOTH roles, and must match the
      # jobmanager's exactly. The fencing token travels with the leader
      # information the HA service hands out, so without them this TaskManager
      # discovers the ResourceManager statically, registers with fencing token 0
      # and the ResourceManager rejects it: "FencingTokenException: ... because
      # the fencing token 0...0 did not match the expected fencing token
      # 9f3175f098076291f8095be45eee44b3", leaving {"taskmanagers":[]} (run9).
      # (Same no-prose-inside-the-block rule as the jobmanager above.)
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.rpc.port: 6123
        taskmanager.rpc.bind-port: 6123
        high-availability.type: zookeeper
        high-availability.zookeeper.quorum: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
        high-availability.storageDir: ${S3_WAREHOUSE_PATH:?set S3_WAREHOUSE_PATH}
        high-availability.zookeeper.path.root: /flink
        high-availability.cluster-id: ${FLINK_CLUSTER_ID:-prod}
        taskmanager.numberOfTaskSlots: 8
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        metrics.reporter.prom.interval: 15 SECONDS
        taskmanager.memory.process.size: 3g
        taskmanager.memory.task.off-heap.size: 512m
        taskmanager.memory.managed.fraction: 0.4
        taskmanager.memory.network.max: 256m
        taskmanager.memory.network.min: 256m
        state.checkpoints.dir: ${CHECKPOINT_DIR:?set CHECKPOINT_DIR to an encrypted s3:// URI}
        state.savepoints.dir: ${CHECKPOINT_DIR:?set CHECKPOINT_DIR to an encrypted s3:// URI}
        state.backend: rocksdb
        state.backend.incremental: "true"
        state.backend.rocksdb.localdir: /tmp/flink-rocksdb
        fs.s3a.server-side-encryption-algorithm: AES256
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      # Prod wiring for Position_State handshake (Option B, DDL 29) — mirrors JM.
      # CHG-252: literal, keep in sync with FLUSS_BOOTSTRAP (see JM).
      FLUSS_BOOTSTRAP_SERVERS: fluss-coordinator:9123
      FLUSS_DATABASE: ${FLUSS_DATABASE:-default}
      POSITION_STATE_TABLE: ${POSITION_STATE_TABLE:-Position_State}
    volumes:
      - flink-checkpoints:/checkpoints
      - flink-logs:/opt/flink/log
    secrets:
      - aws_access_key_id
      - aws_secret_access_key

  # ---- Ingestion ------------------------------------------------------------
  ingestion:
    <<: *common_workload
    image: ${INGESTION_IMAGE:?set INGESTION_IMAGE to an immutable digest}
    networks: [trading-net]
    deploy:
      <<: *deploy_workload
      replicas: 1
      # CHG-275: ingestion is the one service measured spending its restart budget on a
      # TRANSIENT prerequisite — the bridge crashed, and the DDL catalog it reads is
      # applied by a later step of the same deploy (S8). Bounded retries turned that into
      # a manual `docker service update --force`; retrying heals it instead. This
      # overrides the anchor's restart_policy sub-map wholesale (merge-key note at the
      # top). `delay: 30s`, not the anchor's 5s: the failure it must survive lasts as long
      # as the DDL step, and the JVM should not boot every five seconds while it waits.
      restart_policy:
        condition: any
        delay: 30s
      resources:
        limits: {cpus: "4", memory: 4G}
    secrets:
      - arrow_app_secret
      - arrow_password
      - arrow_totp_key
    # The manifest must be present inside the container at the path the app
    # already defaults to (INSTRUMENT_MANIFEST_PATH); without it ingestion refuses
    # to start with "readable manifest FILE is required".
    configs:
      - source: manifest-nse
        target: /instruments/NSE_CM_EQUITY.csv
    environment:
      # P1-077: stack is the prod deploy — prod gates engaged.
      DEPLOYMENT_ENV: production
      # T6: proto is THE transport (CHG-115; NDJSON pipe removed 2026-08-29).
      # TRANSPORT=proto|grpc only; anything else is FATAL in the bridge.
      TRANSPORT: ${TRANSPORT:-proto}
      ARROW_APP_ID: ${ARROW_APP_ID:?set ARROW_APP_ID}
      ARROW_USER_ID: ${ARROW_USER_ID:?set ARROW_USER_ID}
      # The three credentials are mounted as secrets; the arrow-bridge child reads
      # them through its _FILE form so no value lands in the service spec.
      ARROW_APP_SECRET_FILE: /run/secrets/arrow_app_secret
      ARROW_PASSWORD_FILE: /run/secrets/arrow_password
      ARROW_TOTP_KEY_FILE: /run/secrets/arrow_totp_key
      ARROW_INSTRUMENT_TOKENS: ${ARROW_INSTRUMENT_TOKENS:-}
      ARROW_DEBUG_WS: ${ARROW_DEBUG_WS:-}
      ARROW_TICK_COUNTS: ${ARROW_TICK_COUNTS:-}
      ARROW_TICK_COUNTS_FILE: ${ARROW_TICK_COUNTS_FILE:-/tmp/arrow-tick-counts.txt}
      ARROW_HFT_LATENCY_MS: ${ARROW_HFT_LATENCY_MS:-50}
      # T0 3-slot (streaming-3000): env-driven slot count N=1..3. Default 1
      # keeps single-socket 1024 working; N=3 shards a single CSV (3000 rows)
      # as 1024+1024+952 via BuildSubscriptionPlan contiguous chunks.
      # Go/Java both enforce 1..3 (hftRange/intRange). Swarm image must bake
      # manifests under /instruments; for N=3 bake the single 3000-row CSV
      # and set ARROW_HFT_CONNECTIONS=3 (auto-shard). A per-slot CSV list
      # env (the plural form of ARROW_INSTRUMENT_MANIFEST) was an unbuilt
      # T1 alternative — removed 2026-09-09, P5-012 (no reader;
      # auto-shard supersedes).
      ARROW_HFT_CONNECTIONS: ${ARROW_HFT_CONNECTIONS:-1}
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      INSTRUMENT_MANIFEST_PATH: ${INSTRUMENT_MANIFEST_PATH:-/instruments/NSE_CM_EQUITY.csv}
      ARROW_INSTRUMENT_MANIFEST: ${ARROW_INSTRUMENT_MANIFEST:-/instruments/NSE_CM_EQUITY.csv}
      RAW_TABLE_NAME: ${RAW_TABLE_NAME:-raw_table_1}
      ARROW_MAX_EVENT_AGE_MS: ${ARROW_MAX_EVENT_AGE_MS:-5000}
      ARROW_MAX_FUTURE_EVENT_SKEW_MS: ${ARROW_MAX_FUTURE_EVENT_SKEW_MS:-2000}
      CLOCK_OFFSET_LIMIT_MS: ${CLOCK_OFFSET_LIMIT_MS:-2000}
      # T2 tunable backpressure (G2 Ingest) — streaming-3000: 50k/64M (1k) → 150k/192M (3k)
      # Primary: MAX_PENDING_APPEND_* + PENDING_APPEND_WARNING_PERCENT (80% warn / 100% halt).
      # Aliases: PENDING_MAX_RECORDS / PENDING_MAX_BYTES / PENDING_WARNING_PERCENT (primary wins).
      # Prod 3k defaults: 150k records / 192MiB. Override for 1k: 50000 / 67108864.
      MAX_PENDING_APPEND_RECORDS: ${MAX_PENDING_APPEND_RECORDS:-150000}
      MAX_PENDING_APPEND_BYTES: ${MAX_PENDING_APPEND_BYTES:-201326592}
      PENDING_APPEND_WARNING_PERCENT: ${PENDING_APPEND_WARNING_PERCENT:-0.80}
      PENDING_MAX_RECORDS: ${PENDING_MAX_RECORDS:-}
      PENDING_MAX_BYTES: ${PENDING_MAX_BYTES:-}
      PENDING_WARNING_PERCENT: ${PENDING_WARNING_PERCENT:-}
      READINESS_FILE_PATH: /tmp/ingestion.ready
      LOG_DIR: /data/ingestion/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ingestion.ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    volumes:
      - ingestion-logs:/data/ingestion/logs

  # ---- T3 execution bridge (fake/disabled locally; never live Arrow) --------
  execution-bridge:
    <<: *common_workload
    image: ${EXECUTION_BRIDGE_IMAGE:?set EXECUTION_BRIDGE_IMAGE to an immutable digest}
    networks: [execution-net, arrow-egress]
    deploy:
      <<: *deploy_workload
      replicas: 1
      resources:
        limits: {cpus: "1", memory: 1G}
    secrets:
      - execution_bridge_auth_token
    environment:
      # P5-013: the secret is a FILE — the bridge resolves it natively via
      # the _FILE pattern (main.go authTokenFromEnv; direct env still works
      # for non-secret deploys). /healthz stays unauthenticated by design —
      # only /command and /events require the Bearer token.
      EXECUTION_BRIDGE_AUTH_TOKEN_FILE: /run/secrets/execution_bridge_auth_token
      EXECUTION_BRIDGE_MODE: ${EXECUTION_BRIDGE_MODE:-disabled}
      EXECUTION_BRIDGE_LISTEN_ADDR: 0.0.0.0:8787
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---- T8 execution topology (private, zero host ports) ---------------------
  execution-gateway:
    # x-healthcheck: none (GATEWAY_BIND_PORT env-driven, no fixed port) — readiness is the
    # app-level GatewayReadiness gate (gateway must be ready before nautilus trades).
    image: ${EXECUTION_GATEWAY_IMAGE:?set EXECUTION_GATEWAY_IMAGE to an immutable digest}
    networks: [trading-net, execution-net]
    deploy:
      # Single-writer deployment contract: the projection ledger's put is an
      # unconditional last-write-wins upsert, so a second gateway replica can
      # lost-update the same eventId. Raising this needs the versioned conditional
      # write deferred in ProjectionLedgerStore (P3-326) — not a retry.
      replicas: 1
      placement:
        constraints: [node.labels.role == worker]
      restart_policy: {condition: any}
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits: {cpus: "2", memory: 2G}
    secrets:
      - gateway_shared_secret
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      # P3-074: deliberate wildcard — the executor is a peer service/task and no host port is
      # published for the gateway, so the bind stays inside the private network.
      GATEWAY_ALLOW_WILDCARD_BIND: "true"
      GATEWAY_BIND_HOST: 0.0.0.0
      # The secret is mounted read-only at /run/secrets/<name>; GATEWAY_SHARED_SECRET
      # itself is deliberately unset so the value never lands in the service spec.
      GATEWAY_SHARED_SECRET_FILE: /run/secrets/gateway_shared_secret
      GATEWAY_BIND_PORT: "9180"
      NAUTILUS_PRIVATE_ENDPOINT: http://nautilus:9190/v1/intents
      GATEWAY_PROTOCOL_VERSION: execution-gateway.v2
      ACCOUNT_SCOPE_ID: ${ACCOUNT_SCOPE_ID:-prod-scope}
      EXECUTION_PARTITION_ID: ${EXECUTION_PARTITION_ID:-prod-partition}
      GATEWAY_REQUEST_TIMEOUT_MS: "2000"
      GATEWAY_POLL_TIMEOUT_MS: "250"

  nautilus:
    # x-healthcheck: none (EXECUTOR_LISTEN_ADDR is env-driven, no fixed port) — executor
    # liveness/ownership is app-level fencing (one active owner per execution_partition_id).
    image: ${NAUTILUS_IMAGE:?set NAUTILUS_IMAGE to an immutable digest}
    networks: [execution-net]
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      placement:
        constraints: [node.labels.role == worker]
        # Executor fencing: exactly one active owner per execution_partition_id
      restart_policy: {condition: any}
      resources:
        limits: {cpus: "2", memory: 2G}
    secrets:
      - gateway_shared_secret
    environment:
      EXECUTION_ENABLED: "false"         # live-money disabled until all gates pass
      EXECUTOR_LISTEN_ADDR: 0.0.0.0:9190
      # File form of the gateway secret — see execution-gateway.
      GATEWAY_SHARED_SECRET_FILE: /run/secrets/gateway_shared_secret
      BRIDGE_ENDPOINT: http://execution-bridge:8787
      # CHG-079 (2026-08-21): BRIDGE_ENDPOINT now selects the production HttpBridgeClient
      # transport. Bridge side is wired (P5-013): the bridge reads the Swarm
      # secret via EXECUTION_BRIDGE_AUTH_TOKEN_FILE. THIS service still needs
      # BRIDGE_AUTH_TOKEN from the same secret before execution can be enabled —
      # the Rust executor reads plain env only, so it needs its own _FILE (or
      # wrapper) support; open P3 work. Gate stays HALTED (EXECUTION_ENABLED
      # false) so no command ever flows meanwhile.
      GATEWAY_ENDPOINT: http://execution-gateway:9180
      GATEWAY_PROTOCOL_VERSION: execution-gateway.v2
      # CHG-288: the drift gate's offset comes from the file the node publishes
      # (clock_offset_fact.sh, run every 10 s by arrow-clock-offset.timer), never from chronyd's
      # command socket: the package owns /run/chrony as 0700 _chrony:_chrony, and the socket is
      # unauthenticated — whoever can read it can also move the very clock this gate protects.
      # The *directory* is mounted, so the reader resolves the name at open time and sees each new
      # sample (a file mount would pin the inode and keep the first sample forever).
      # Absent, stale, or unreadable sample -> Unmeasurable -> gate HALTED.
      CLOCK_OFFSET_SOURCE: clockfile
      CLOCK_OFFSET_FILE: /run/arrow-clock/offset
      CLOCK_OFFSET_MAX_AGE_S: "30"
    volumes:
      - /run/arrow-clock:/run/arrow-clock:ro

  # ---- Observability (VM4 / O1: outside Swarm, not a scheduling dependency) -
  # In production O1 is a dedicated host (not part of the manager quorum). If O1
  # joins Swarm as a Worker, these services pin to `observability == true` so they
  # never take core workload capacity; openobserve loss must never authorize
  # orders or erase durable audit (OPS-FAIL-001).
  # x-note: the collector's prometheus receiver scrapes `node-exporter:9100` and
  #   `cadvisor:8080` (jobs infra-host and infra-containers). Neither service was
  #   in this file, so both jobs failed every 15 s and their panels stayed empty —
  #   a missing scrape target warns, it does not break a deploy, which is why it
  #   went unnoticed (CHG-257). Both agents run on every node (CHG-265) and the
  #   scrape that reaches them lives in the single-replica collector
  #   (`tasks.node-exporter` / `tasks.cadvisor`, CHG-273) — a scraper on every
  #   node would store each host metric once per node.
  #   CHG-283: those two jobs now use dns_sd_configs, because a static target for a
  #   multi-address name scrapes one address and labels it with the name — one
  #   node's numbers, labelled as if they were all of them.
  node-exporter:
    # Host metrics. The three host mounts plus --path.* are what make the numbers
    # belong to the VM: without --path.rootfs the filesystem collectors read the
    # container's own overlay root (P5-026).
    # x-note: compose sets `pid: host` here; `docker stack deploy` DROPS it
    #   (measured 2026-09-20: the running task reports pidmode empty, while the
    #   three mounts survive). It is not needed for correct numbers because the
    #   collectors read the mounted /host/proc and /host/sys (CHG-257).
    image: ${NODE_EXPORTER_IMAGE:-quay.io/prometheus/node-exporter@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706}
    networks: [trading-net]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.rootfs=/rootfs
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    healthcheck:
      # Self-probe only (DEC-047: never another service). Measured on the image
      # 2026-09-20: `wget` exists in it and /-/healthy answers 200.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9100/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # CHG-265: no placement constraint, on purpose. A per-host agent is the one
    # service class whose correct placement is "every node" — that is what
    # `mode: global` means — and any label here is a conditional that decides for
    # a human. Both agents used to pin to `observability == true`, so on four VMs
    # the trading nodes' own host and container metrics were collected from
    # nowhere. Measured cost of running them everywhere (2026-09-20, per node):
    # node-exporter 9.9 MiB / 0.00% CPU, cadvisor 99.7 MiB / 2.58% CPU.
    # The hostname is what makes four nodes tell each other apart: node-exporter
    # reports `node_uname_info{nodename=...}` from its UTS namespace, which is
    # the container id unless it is set (measured 2026-09-20: nodename=
    # "f77f64fd95c1" before, the VM's own name after this template).
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global
      restart_policy:
        condition: any
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "1"
          memory: 512M
  cadvisor:
    # Container metrics. The compose service is `privileged: true`; Swarm DROPS
    # that key — measured 2026-09-20 on the task: privileged=false, while all five
    # host mounts survive and cAdvisor reads cgroups through them (it recovered
    # every container within a second of start). The key is not repeated here:
    # config that does nothing is worse than no config, and a security reviewer
    # would read `privileged: true` as a statement about the running task.
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388}
    networks: [trading-net]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    healthcheck:
      # Self-probe only (DEC-047). Measured on the image 2026-09-20: `wget` exists
      # and /healthz answers 200 without the host mounts, so the probe tests the
      # process, not the data.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # CHG-265: no placement constraint, on purpose. A per-host agent is the one
    # service class whose correct placement is "every node" — that is what
    # `mode: global` means — and any label here is a conditional that decides for
    # a human. Both agents used to pin to `observability == true`, so on four VMs
    # the trading nodes' own host and container metrics were collected from
    # nowhere. Measured cost of running them everywhere (2026-09-20, per node):
    # node-exporter 9.9 MiB / 0.00% CPU, cadvisor 99.7 MiB / 2.58% CPU.
    # The hostname is what makes four nodes tell each other apart: node-exporter
    # reports `node_uname_info{nodename=...}` from its UTS namespace, which is
    # the container id unless it is set (measured 2026-09-20: nodename=
    # "f77f64fd95c1" before, the VM's own name after this template).
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global
      restart_policy:
        condition: any
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "1"
          memory: 1G
  otel-collector:
    # CHG-273: the NETWORK half, and deliberately a singleton. `mode: global` with
    # a placement constraint (what this service used to say) is a contradiction the
    # engine resolves in favour of the constraint — one task, on the observability
    # node — while reading as "every node" to a human. The two halves are now
    # explicit: this one scrapes and receives, its sibling reads files.
    #   Why one replica is not a limitation but a requirement: the prometheus
    #   receiver scrapes `tasks.node-exporter` / `tasks.cadvisor`, i.e. EVERY node's
    #   agent. Running this on four nodes would store each host metric four times
    #   (wrong rate() and sum() in every panel), so the scraper is the single writer.
    # x-healthcheck: none (no shell in the image — verified: neither /bin/sh nor
    #   /busybox/sh can exec — so no in-container probe can run; liveness is the
    #   health_check extension on 0.0.0.0:13133 in the collector config).
    image: otel/opentelemetry-collector-contrib@sha256:e39311df1f3d941923c00da79ac7ba6269124a870ee87e3c3ad24d60f8aee4d2
    networks: [trading-net]
    command: ["--config=/etc/otel-collector-config.yaml"]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.observability == true]
      restart_policy: {condition: any}
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits: {cpus: "2", memory: 2G}
    secrets:
      - o2_auth_basic
    configs:
      - source: otel-collector-config
        target: /etc/otel-collector-config.yaml
    # CHG-273: no host mounts and no `user:` here any more. Every file it used to
    # read (the three node-local log volumes and the host's /var/log) now belongs to
    # otel-collector-logs — one file, one reader, and no root-owned process that does
    # not need to be one.

  otel-collector-logs:
    # CHG-273: the PER-HOST FILE half. Global and unconstrained on purpose: the
    # filelog receivers read files that exist on exactly one node — the host's
    # /var/log and the node-local named volumes (ingestion-logs, flink-logs,
    # fluss-logs). The old single collector mounted its OWN copies of those volumes,
    # so on four VMs the logs written on VM1-3 were collected from nowhere: the bind
    # mount and the volumes are per node, and an empty directory reads as silence,
    # not as an error. Same rule as node-exporter and cadvisor (CHG-265) — a per-host
    # agent belongs on every node. Measured cost of the agent class, 2026-09-20:
    # node-exporter 9.9 MiB, cadvisor 99.7 MiB per node; this one batches files and
    # is bounded by memory_limiter at 512 MiB.
    # x-healthcheck: none — same distroless image, so liveness is the health_check
    #   extension on 0.0.0.0:13133; it exposes no port a probe could use.
    image: otel/opentelemetry-collector-contrib@sha256:e39311df1f3d941923c00da79ac7ba6269124a870ee87e3c3ad24d60f8aee4d2
    networks: [trading-net]
    command: ["--config=/etc/otel-collector-logs.yaml"]
    deploy:
      mode: global
      restart_policy: {condition: any}
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits: {cpus: "1", memory: 1G}
    # CHG-273: the node's own name. The collector config's resource/node processor
    # reads HOSTNAME (the container hostname) into `resource.host.name`, which is what
    # tells four nodes' log lines apart in one O2 stream — the same mechanism
    # node-exporter uses for `nodename`.
    hostname: "{{.Node.Hostname}}"
    secrets:
      - o2_auth_basic
    configs:
      - source: otel-collector-logs-config
        target: /etc/otel-collector-logs.yaml
    # CHG-263: `user: "0:4"` (root:adm) is forced by measurement, not preference:
    # auth.log and kern.log are `640 syslog:adm`, boot.log is `600 root`, the image
    # defaults to uid 10001, and a stack file CANNOT add a supplementary group —
    # `group_add` is rejected ("Additional property group_add is not allowed"), while
    # `user` is accepted and lands on the task. Read-only, so the collector may read
    # the logs and cannot alter them.
    user: "0:4"
    volumes:
      - ingestion-logs:/data/ingestion/logs:ro
      - flink-logs:/data/flink/logs:ro
      - fluss-logs:/data/fluss/logs:ro
      - type: bind
        source: /var/log
        target: /var/log
        read_only: true

  openobserve:
    image: ${OPENOBSERVE_IMAGE:?set OPENOBSERVE_IMAGE to an immutable digest}
    networks: [trading-net]
    # CHG-260: exactly one published port in the whole stack, and it is the one
    # the operator needs — OpenObserve is the single pane of truth, so its UI has
    # to be reachable without editing a running service. `mode: host` keeps it on
    # the node that actually runs the task instead of meshing it across the swarm.
    #   Two measured constraints decide the shape (2026-09-20):
    #   1. `host_ip` is NOT allowed in a stack file — the engine rejects the deploy
    #      with "Additional property host_ip is not allowed", so a loopback-only
    #      publish is not expressible at all (nor via --publish-add, whose grammar
    #      has no host_ip either);
    #   2. therefore the port binds 0.0.0.0:5080 on that node and the FIREWALL is
    #      the control, not the stack file: S4 restricts 5080 to the operator's
    #      address. The value of publishing here rather than by hand is that it
    #      survives every redeploy.
    ports:
      - mode: host
        published: 5080
        target: 5080
    # x-healthcheck: none (static /openobserve binary, no shell/curl/wget, 
    # a CMD-SHELL probe can never run: exit=-1 with the status flipping to
    # unhealthy, so the dead probe was removed rather than repaired)
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      replicas: 1
      placement:
        constraints: [node.labels.observability == true]
      restart_policy: {condition: any}
      resources:
        limits: {cpus: "4", memory: 8G}
    environment:
      # OpenObserve reads ZO_ROOT_USER_PASSWORD from the environment only — it has
      # no *_FILE form (measured on v0.91.5: it panics at startup when the var is
      # absent, even with the secret mounted). The value therefore comes from the
      # deploy environment; CHG-249 records the wrapper-image upgrade path that
      # restores secret-only delivery.
      ZO_ROOT_USER_PASSWORD: ${O2_PASSWORD:?set O2_PASSWORD}
      ZO_ROOT_USER_EMAIL: ${O2_USER:-admin@example.com}
      ZO_MAX_FILE_RETENTION_TIME: ${ZO_MAX_FILE_RETENTION_TIME:-3600}
      ZO_MAX_FILE_SIZE_ON_DISK: ${ZO_MAX_FILE_SIZE_ON_DISK:-128}
      ZO_MAX_FILE_SIZE_IN_MEMORY: ${ZO_MAX_FILE_SIZE_IN_MEMORY:-128}
    volumes:
      - openobserve-data:/data

  alert-consumer:
    # G6 alert routing — persistent single-webhook consumer (dev twin:
    # docker-compose.yml alert-consumer; CHG-093 stdout receiver retired).
    # x-healthcheck: none (stateless ingress; port is set in-app, restart policy covers
    # liveness; its correctness is tested by webhook dispatch unit tests).
    # NOTE (fixed 2026-08-31): the predecessor service ran
    # /app/webhook-receiver.py with NO mount of that file — it would have
    # crash-looped on this stack; the script now ships as a Swarm config.
    image: python@sha256:9c900dea9e8fb7e16277c179b555cc72d29a352dbc33cff48ad5a0412fd5bfc7
    networks: [trading-net]
    configs:
      - source: alert-consumer-src
        target: /app/alert-consumer.py
    volumes:
      - alert-store:/data/alerts
    environment:
      # Swarm: O2 and the consumer are separate netns — the destination URL
      # must be http://alert-consumer:9999/noop (service DNS), NOT localhost,
      # and the consumer must bind the overlay interface, not loopback.
      ALERT_CONSUMER_PORT: "9999"
      ALERT_BIND: "0.0.0.0"
    deploy:
      # P5-011 residue fix: stateful (alert-store volume) — inherit the
      # common update/rollback policies; placement stays observability-pinned.
      <<: *deploy_workload
      replicas: 1
      placement:
        constraints: [node.labels.observability == true]
      # CHG-258: the workload budget does not fit an observability service. Four
      # attempts in 120 s then stop means the alert path silently disappears when
      # the webhook target is down longer than two minutes — the opposite of what
      # a single pane of truth needs. Infrastructure retries forever; only the
      # trading services stop and wait for an operator.
      restart_policy:
        condition: any
      resources:
        limits: {cpus: "1", memory: 512M}
    command: ["python3", "/app/alert-consumer.py"]


  eod-scheduler:
    # SCH-23 / operational §6.13: the EOD controller is a one-shot and nothing
    # scheduled it, so in production the manifest lifecycle never started. This is
    # the scheduled owner: it sleeps until EOD_AT in EOD_ZONE, runs the controller,
    # and keeps a heartbeat its own healthcheck reads. Durability stays the
    # controller's — state and lease live in Fluss, so a second fire the same day is
    # harmless by construction; this service decides only *when*.
    #
    # Same image as ddl-apply, deliberately: both one-shots need java,
    # common/target/classes and the pinned jars, and the image already sets
    # DDL_APPLY_M2_REPO for exactly that classpath (eod_controller.py honours it).
    image: ${DDL_APPLY_IMAGE:?set DDL_APPLY_IMAGE to an immutable digest}
    # The image's ENTRYPOINT is the DDL one-shot and its CMD is `validate`; this is
    # the other one-shot, so both have to be overridden.
    entrypoint: ["python3", "/app/code/01_platform/04_scripts/eod_schedule.py"]
    command: ["--at", "${EOD_AT:-23:30}", "--zone", "${EOD_ZONE:-Asia/Kolkata}"]
    networks: [trading-net]
    environment:
      FLUSS_BOOTSTRAP: fluss-coordinator:9123
      # The heartbeat the healthcheck below reads: one path, both places.
      EOD_HEARTBEAT: /tmp/eod-scheduler-heartbeat
      # No default on purpose. Which tables are EOD-eligible is an operator
      # decision, and the tool refuses to run without it (fail-closed).
      EOD_TABLES: "${EOD_TABLES:?set EOD_TABLES to the eligible tables, comma separated}"
      # Fail-closed: `none` runs the lifecycle without copying to the lake. Set
      # `lake` only where R2 credentials are present.
      EOD_OFFLOAD: "${EOD_OFFLOAD:-none}"
      # C2: what `lake` mode needs to read its evidence. r2-list.sh ships in the
      # image beside the entrypoint; the controller writes its config files from
      # these values and the two secret files, then removes them after the run.
      # The three R2 values are required for the same reason the tiering services
      # require them: a scheduler that cannot see the lake must not start.
      R2_LIST_SCRIPT: /app/code/01_platform/04_scripts/r2-list.sh
      R2_LAKE_PREFIX: "${R2_LAKE_PREFIX:-lake}"
      R2_ENDPOINT: "${R2_ENDPOINT:?set R2_ENDPOINT for the lake offload}"
      R2_BUCKET: "${R2_BUCKET:?set R2_BUCKET for the lake offload}"
      S3_WAREHOUSE_PATH: "${S3_WAREHOUSE_PATH:?set S3_WAREHOUSE_PATH for the lake offload}"
      FLUSS_DATABASE: ${FLUSS_DATABASE:-default}
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
    healthcheck:
      # Its own heartbeat file — never another service (house rule 6). The window
      # covers a whole controller run: a fire heartbeats at its start and end, and
      # the lease TTL is 30 minutes, so a stale heartbeat means "stuck".
      test: ["CMD", "python3", "/app/code/01_platform/04_scripts/eod_schedule.py",
             "--check-heartbeat", "--max-age", "2700"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      <<: *deploy_workload
      # Exactly one. Two schedulers would fire the same day twice — harmless
      # because of the lease, but not what "once a day" means.
      replicas: 1
      # CHG-258 reasoning, applied to a schedule: a scheduler that gives up is a
      # schedule that silently does not exist. Restarting forever is visible — task
      # restarts and the container's own logs — while a service that stopped at
      # 23:30 is invisible unless someone reads `docker service ls`.
      restart_policy:
        condition: any
