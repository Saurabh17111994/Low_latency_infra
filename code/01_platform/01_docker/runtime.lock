FLINK_IMAGE=flink:2.2.1-scala_2.12-java17@sha256:1934ab4b984d0873ef46825b1140377eed34475904aa077062497712d6e259f8
# NOTE (2026-09-15, digest-pin live probe): flink:2.2.1-scala_2.12-java17 tag
# has moved upstream (index sha256:d2b6d48b..., 2026-09-09, new temurin base).
# Lock keeps 1934ab4b... (2026-08-21, still resolves) — deliberate drift, not
# stale. Re-pin only on unresolvable digest, CVE, or deliberate Flink upgrade
# with full stack re-verify + change record.
OPENOBSERVE_IMAGE=public.ecr.aws/zinclabs/openobserve:v0.91.5-amd64@sha256:9e3da77459b0b53a2b955fb34ae08ddf01be04b0699a5c1ffefb36bf05ae5644
# NOTE (2026-09-15, P6-140 re-pin): the four *_IMAGE refs below are locally built
# images (`make images`) that were never pushed, so they have no RepoDigests and no
# registry manifest digest — the image ID is the only digest that exists, and it is
# what a build host can verify (docker image inspect <repo>:latest -> .Id).
# `docker run <repo>@sha256:<image-id>` does NOT resolve: digest resolution goes
# through RepoDigests/manifests, not the config digest. Treat these four lines as
# provenance ("which image was tested"), not as a pullable ref; a deploy needs a
# pushed manifest digest (push, then `digest-pin.sh <image:tag>`). Re-pin after every rebuild:
#   python3 -m unittest discover -s code/01_platform/04_scripts/tests -p test_pin_check.py
# names the stale line (test_local_build_pins_match_the_local_images).
# Freshness (does the image contain the current sources?) is a different check —
# `make check-image-stale` / image_staleness_check.py, run as a gate step. A pin
# can match this host and still be a stale build; rebuild before deploying.
INGESTION_IMAGE=01_docker-ingestion@sha256:5e363c21e76a16b29670482939129fd0bc2010b4a67c7f4eee84e0a082de4e7c  # local build — image ID (config digest), not a registry manifest
# COMPUTE_IMAGE=  # built from code/02_services/02_compute — pin digest
# EXECUTOR_IMAGE=  # built from code/02_services/04_executor — pin digest

