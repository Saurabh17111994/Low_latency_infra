# Runtime lock — pinned semantic versions for the streaming trading platform.
#
# Purpose: every container image, library, and runtime version that affects
# reproducible behavior is pinned here. This file is the single source of truth
# for version compatibility. No "latest", no ranges.
#
# Usage: copy to runtime.lock and fill image digests when they are available.
# Never commit digests you cannot verify from the upstream registry.
#
# VERSIONS: aligned to the pinned version matrix (DEC-021, project memory #17).
#   Fluss: 0.9.1-incubating | Flink: 2.2.1 | Java: 17.0.19 | Python: 3.11.9
#   OpenObserve: v0.91.5-amd64 (public.ecr.aws/zinclabs/openobserve)
#
# Last updated: 2026-09-18 (CHG-218: the four local-build image IDs are retired as pins and
#   kept as comments below. `make check-image-stale` owns "is this image current?" by content
#   stamp; an image ID cannot answer it — a rebuild changes it, and a source change without a
#   rebuild leaves it untouched.)
# Previous: 2026-09-18 (waves 36-38: INGESTION_IMAGE + EXECUTION_GATEWAY_IMAGE re-pinned
#   after their rebuild — those two modules' code changed; nautilus and execution-bridge
#   were unchanged and still match)
# Previous: 2026-09-15 (P6-140: the four local-build image IDs re-pinned to their full
#   64-hex form — they carried 12-hex truncations)

# ---- Container image versions (semantic tags; fill digests before production) ----
FLUSS_IMAGE=apache/fluss:0.9.1-incubating@sha256:65f5513b33dde10ace4f8adb3956f17226a2a1e2663f92b3096e4769b0ee1d1c
FLINK_IMAGE=flink:2.2.1-scala_2.12-java17@sha256:1934ab4b984d0873ef46825b1140377eed34475904aa077062497712d6e259f8
# NOTE (2026-09-15, digest-pin live probe): flink:2.2.1-scala_2.12-java17 tag
# has moved upstream (index sha256:d2b6d48b..., 2026-09-09, new temurin base).
# Lock keeps 1934ab4b... (2026-08-21, still resolves) — deliberate drift, not
# stale. Re-pin only on unresolvable digest, CVE, or deliberate Flink upgrade
# with full stack re-verify + change record.
OPENOBSERVE_IMAGE=public.ecr.aws/zinclabs/openobserve:v0.91.5-amd64@sha256:9e3da77459b0b53a2b955fb34ae08ddf01be04b0699a5c1ffefb36bf05ae5644
# RETIRED as pins (2026-09-18, CHG-218): the four *_IMAGE refs below are locally built
# images (`make images`) that were never pushed, so they have no RepoDigests and no
# registry manifest digest — the image ID was the only digest that exists, and it is
# what a build host can verify (docker image inspect <repo>:latest -> .Id).
# `docker run <repo>@sha256:<image-id>` does NOT resolve: digest resolution goes
# through RepoDigests/manifests, not the config digest.
#
# Why they are no longer pinned: an image ID cannot answer the question that matters —
# "does this image contain the sources being certified?" A rebuild from identical sources
# changes the ID (red on a correct image), while a source change without a rebuild leaves
# it untouched (green on a stale image). `make check-image-stale` / image_staleness_check.py
# owns that question with a content stamp (`com.trading.build-stamp`), and gate step 18
# runs it after the image build. The IDs below are kept for provenance only ("which image
# was last built here"). A deploy needs a pushed manifest digest: push, then
# `digest-pin.sh <image:tag>`, and pin THAT on an active line.
# INGESTION_IMAGE=01_docker-ingestion@sha256:ddf59dc8953d9f38492e3a9ba2401f4980ceeaf5c45ed35559169b60de4bc2ef
# COMPUTE_IMAGE=  # built from code/02_services/02_compute — pin digest
# EXECUTOR_IMAGE=  # built from code/02_services/04_executor — pin digest

# ---- Library and runtime versions (from code/pom.xml dependency management) ----
FLINK_VERSION=2.2.1
FLUSS_VERSION=0.9.1-incubating
JAVA_VERSION=17.0.19
SCALA_BINARY_VERSION=2.12

# ---- Fluss-Flink connector ----
# Fluss 0.9.1-incubating ships connectors matching Flink minor: fluss-flink-2.2
FLUSS_FLINK_CONNECTOR=fluss-flink-2.2

# ---- Arrow Trade protocol evidence ----
# Market-data: binary WebSocket, 4 modes (LTP 13B, LTPC 17B, Quote 93B, Full 241B)
# Order execution: REST POST /order/regular on https://edge.arrow.trade
# Order updates: JSON WebSocket on wss://order-updates.arrow.trade
# Reconciliation: GET /user/orders, /user/trades, /user/positions, /order/{id}
# Auth (2026-08-24+): TOTP AutoLogin — ARROW_APP_ID + ARROW_APP_SECRET +
#   ARROW_USER_ID + ARROW_PASSWORD + ARROW_TOTP_KEY (client.AutoLogin).
#   ARROW_TOKEN is REMOVED (dead since 2026-08-24); only the faketool test
#   broker path (run-full-suite.sh, ARROW_FAKE_BROKER=1) sets a fake token.
# SDK: github.com/arrow-trade/go-arrow
# Rate limit: 10 req/sec per endpoint

# ---- Required env vars (values from .env; listed here for completeness) ----
# ARROW_MARKET_DATA_URL, ARROW_ORDER_UPDATES_URL, ARROW_REST_URL
# ARROW_APP_ID, ARROW_APP_SECRET, ARROW_USER_ID, ARROW_PASSWORD, ARROW_TOTP_KEY
# EXECUTION_ENABLED (must be false)
# AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_WAREHOUSE_PATH
# O2_USER, O2_PASSWORD
# OTEL_EXPORTER_OTLP_ENDPOINT

