# =============================================================================
# docker-compose.soak.yml — soak override for the unattended full-suite run
# (run-full-suite.sh, Steps 1-4 of the remaining plan).
#
# Runs the ingestion container against the LOCAL fake HFT broker (host
# process, no live Arrow credentials) so the container-runtime run and the
# 7h soak need no human or AI attention. The fake broker publishes port 8899
# on the Docker host; the container reaches it via the bridge gateway.
#
# Usage:
#   SOAK_JOURNAL_DIR=<host dir> docker compose -f docker-compose.yml \
#     -f docker-compose.soak.yml up -d ingestion
#
# Volume merge semantics: long-form bind entries REPLACE base entries with
# the same target (journal dir + manifest mount).
# =============================================================================
services:
  ingestion:
    # Host networking (R-222): the Fluss cluster's advertised.listeners are
    # host-oriented (CLIENT://localhost:9123/9124) because the Stage-2
    # marathon java is host-native, and the fake broker is a host process.
    # A container on trading-net cannot use those advertised endpoints
    # (localhost = itself; tablet host port 9124 != container port 9123),
    # so the soak container joins the HOST network: loopback reaches the
    # host-published Fluss ports and the faketool directly. Changing
    # advertised.listeners instead would break the Stage-2 host client.
    # `!reset` clears the base `networks: [trading-net]` — compose forbids
    # combining network_mode with networks.
    networks: !reset []
    network_mode: host
    environment:
      # Fluss bootstrap via host-published coordinator port (compose DNS
      # names are unresolvable on the host network).
      FLUSS_BOOTSTRAP: localhost:9123
      # Fake broker is a host process on the host loopback.
      ARROW_HFT_URL: ws://127.0.0.1:8899
      # OTel collector is a host-published port; the default
      # `otel-collector:4318` is unresolvable on the host network.
      OTEL_COLLECTOR_HOST: localhost:4318
      # The OTel SDK exporter reads OTEL_EXPORTER_OTLP_ENDPOINT (NOT
      # OTEL_COLLECTOR_HOST) — without this override it defaults to
      # `otel-collector:4317`, which is unresolvable on the host network
      # and fails ingestion at startup (UnknownHostException, 0 ticks
      # appended — observed 2026-08-26 during PERF-AUDIT-001 smoke).
      # otel-collector publishes 4317 (gRPC) + 4318 (HTTP) on the host.
      # The javaagent's default OTLP protocol is http/protobuf (HTTP), so
      # the endpoint MUST be the HTTP port 4318, NOT the gRPC port 4317:
      # HTTP/1.1 against gRPC returns binary framing → OkHttp
      # `EOFException: \n not found` → the agent exporter spins forever,
      # wedging the JVM reader loop → 0 ticks processed (observed 199x
      # during PERF-AUDIT-001 smoke, 2026-08-26).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      # Dummy credentials: fake broker performs no auth; TOTP only (ARROW_TOKEN removed 2026-08-24)
      ARROW_APP_ID: soak
      ARROW_APP_SECRET: soaksecret
      ARROW_USER_ID: soak-user
      ARROW_PASSWORD: soak-pass
      ARROW_TOTP_KEY: JBSWY3DPEHPK3PXP
      # Test-only fake-broker auth mode (main.go isFakeBrokerMode): skip
      # AutoLogin so the bridge can run against faketool (WS feed on
      # localhost:8899) without hitting the real login API. Without this,
      # the bridge AutoLogins with dummy creds -> faketool has no login
      # REST endpoint -> HTTP 400 "user not found" -> BRIDGE_CRASH exit 2
      # -> 0 ticks (observed 2026-08-26 PERF-AUDIT-001 smoke).
      ARROW_FAKE_BROKER: "1"
      # T0 3-slot: env-driven N=1..3, default 1 for 1k baseline; N=3 uses 1024+1024+952 via BuildSubscriptionPlan.
      ARROW_HFT_CONNECTIONS: ${ARROW_HFT_CONNECTIONS:-1}
      GO_ARROW_SDK_VERSION: v0.0.0-20260622-7cce1630
      # Fake-feed soaks have no live wall-clock feed to cross-check.
      CLOCK_CHECK_REQUIRED: "false"
      NTP_SERVER: ntp.ubuntu.com,time.google.com,in.pool.ntp.org
      # Journal on a host bind mount so soak evidence scripts read it.
      LOG_DIR: /data/ingestion/logs
    volumes:
      - type: bind
        source: ${SOAK_JOURNAL_DIR:-/tmp/soak-journal}
        target: /data/ingestion/logs
      # Approved 1,024-instrument manifest (quoted CSV containing fake token
      # 757614) — replaces the base compose mount of the full NSE file so the
      # fake tick token passes manifest validation.
      - type: bind
        # 2026-10-01 (audit H7): SOAK_MANIFEST_PATH overrides the dev-PC default;
        # the fallback stays for the dev workflow only.
        source: ${SOAK_MANIFEST_PATH:-/home/saurabh/Jupyter_notebook/Flink_Fluss_Infrastructure/Arrow_broker/instruments/cash_stocks/NSE_CM_EQUITY (1024).csv}
        target: /instruments/NSE_CM_EQUITY.csv
        read_only: true
