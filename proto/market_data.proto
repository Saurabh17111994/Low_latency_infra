// market_data.proto — low-latency ingestion transport contract (T1)
//
// Canonical framing between the Go bridge (decoder) and the Java
// fluss-writer (persister). Field set verified 2026-08-27 against:
//   - Go  Tick  struct        (go-bridge/main.go:21)
//   - Java GoTick (Jackson)   (IngestionService.java)
//   - SDK HFTFullTick/HFTLTPTick (vendored go-arrow)
//   - FlussClientAdapter row build (which columns actually persist)
//
// Design rules (locked, do not violate):
//   - Prices are INTEGER paise. NO float anywhere in the path.
//   - raw_payload is the EXACT original broker packet bytes (never base64/JSON).
//   - decoder_version/protocol_version are SET IN JAVA at row-build
//     (FlussClientAdapter.java:174-175: "go-arrow-sdk"/""), NOT carried from Go.
//   - Per-row payload_hash computed ONCE in Go (sha256 of raw_payload).
//   - Control records (bridge_metrics/broker_quarantine/bridge_event) ride the
//     same transport, distinguishable by record_type.

syntax = "proto3";

package marketdata;

option go_package = "github.com/trading/arrow-bridge/marketdata;marketdata";
option java_package = "com.trading.ingestion.transport";
option java_multiple_files = true;
option java_outer_classname = "MarketDataProto";

// ── Market data batch (the unit of transport) ────────────────────────────────

message MarketDataBatch {
  string connection_id = 1;    // "ingestion-local/hft-0"
  int64  connection_epoch = 2; // monotonic per slot, increments per reconnect
  int64  batch_seq = 3;        // per-connection monotonic batch counter
  int64  created_ms = 4;       // T2 (batch creation, ms epoch)
  repeated TickEvent events = 5;
  bytes  batch_payload_hash = 6; // sha256 over concatenated raw payloads (Q5, computed in Go)
}

// ── One tick event ───────────────────────────────────────────────────────────

message TickEvent {
  // control / provenance
  string slot_id = 1;
  string mode = 2;             // "ltp" | "ltpc" | "quote" | "full"
  int32  token = 3;            // instrument_token (Go int32 — bit-exact)
  string feed = 29;            // "hft" (Go Tick.Feed, not persisted to row but carried for parity)
  int64  ts_ms = 4;            // exchange timestamp (source time, preserved — Q29)
  int64  received_ms = 5;      // T1 (Go receipt)
  int64  feed_sequence_local = 6; // connection-local sequence (Q15: verify packet has real seq first)

  // market data — prices are integer paise, never float (doc §28)
  int64  ltp_paise = 7;
  int64  close_paise = 8;
  int64  open_paise = 9;
  int64  high_paise = 10;
  int64  low_paise = 11;
  int64  vwap_paise = 12;
  int64  ltq = 13;
  int64  volume = 14;
  int64  total_buy_qty = 15;
  int64  total_sell_qty = 16;
  int64  open_interest = 17;
  repeated int32 bid_px = 18;    // fixed 5 (Q-O2)
  repeated int32 ask_px = 19;
  repeated int32 bid_qty = 20;
  repeated int32 ask_qty = 21;
  repeated uint32 bid_orders = 22; // Go [5]uint16 — uint32 for proto3 (no uint16)
  repeated uint32 ask_orders = 23;

  // payload preservation (Q3, Q6) — never base64
  bytes  raw_payload = 24;      // EXACT original broker packet bytes
  string fingerprint_version = 25;
  string event_fingerprint = 26; // computed in Java (Q19); Go does NOT compute
  string decoder_version = 27;   // SET IN JAVA at row-build (not from Go)
  string protocol_version = 28;  // SET IN JAVA at row-build (not from Go)

  // payload integrity (Q5): sha256 of raw_payload, computed ONCE in Go
  bytes payload_hash = 30;

  // T8 staged-latency timestamps (ms epoch, monotonic — never persisted,
  // transport-only provenance for the T8 latency budget):
  int64  go_received_ms = 31;  // T1: Go bridge receipt (source of received_ms)
  int64  go_emit_ms = 32;      // T6: Go batcher Add (before proto marshal/write)
}

// ── Control records (Q20) — ride the same transport, distinguished by type ───

message ControlRecord {
  string record_type = 1;       // "bridge_metrics" | "broker_quarantine" | "bridge_event"
  int32  contract_version = 2;  // Java rejects unknown versions → quarantine
  string event = 3;
  string slot_id = 4;
  string connection_id = 5;
  int64  connection_epoch = 6;
  string state = 7;
  int32  assigned_tokens = 8;
  int32  acknowledged_tokens = 9;
  int32  rejected_tokens = 10;
  string reason = 11;
  int64  received_ts_ms = 12;
  string manifest_fingerprint = 13;
  string assigned_token_set_hash = 14;  // slot-identity safety contract
  // bridge_metrics extension
  int32  reconnect_consecutive = 15;
  int32  active_sockets = 16;
  int32  go_goroutines = 17;
  int64  ts_ms = 18;
  // broker_quarantine extension
  bytes  raw_payload = 19;
  string broker_error = 20;
}

// ── Transport envelope (one framing for market data + control) ───────────────

message TransportFrame {
  oneof payload {
    MarketDataBatch market_batch = 1;
    ControlRecord control = 2;
  }
  int32 protocol_version = 3;   // framing version; Java rejects unknown → quarantine
}
