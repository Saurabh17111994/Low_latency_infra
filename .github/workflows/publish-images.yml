# publish-images.yml — build the seven project images and publish them to GHCR.
#
# Why CI rather than a laptop (decision D1,
# docs/plans/2026-09-21-ci-publish-and-single-node-rollout.md): a manual push
# keeps a workstation in the production artifact path and needs a long-lived
# personal access token. The runner's built-in GITHUB_TOKEN needs neither, and
# public packages pull anonymously — so no registry credential exists on any VM.
#
# Trigger: manual only for now. A `v*` tag trigger is deliberate later work: a
# tag-triggered run cannot safely commit the digest fragment to the default
# branch (the tag may not be on it), and a publish whose digests exist only in a
# log is not durable. See the plan's dated note on D3.
#
# No secret is used. Every value below only has to parse: docker-compose.yml
# refuses to interpolate without six ${VAR:?} values, and a build never pulls
# them. The real values live in the operator's git-ignored deploy env.
name: publish-images

on:
  workflow_dispatch:

permissions:
  contents: write   # commit the digest fragment
  packages: write   # push to GHCR with the built-in token

concurrency:
  group: publish-images
  cancel-in-progress: false   # a half-published release is worse than a slow one

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # The two runtime refs name the tags `make flink-image` / `make fluss-image`
      # produce. The OpenObserve image is stock upstream and never republished.
      FLINK_IMAGE: trading-flink-runtime:0.1.0
      FLUSS_IMAGE: trading-fluss-runtime:0.1.0
      OPENOBSERVE_IMAGE: public.ecr.aws/zinclabs/openobserve:v0.91.5-amd64
      R2_BUCKET: ci-placeholder
      R2_ENDPOINT: https://ci-placeholder.invalid
      S3_WAREHOUSE_PATH: s3://ci-placeholder/warehouse

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Free runner disk
        # Two runtime images plus eight service images do not fit the default
        # free space. Nothing in this job needs the toolcache.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker image prune -af >/dev/null
          df -h / | tail -1

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create the env files the build expects
        # `make images` passes both --env-file paths to docker compose, so both
        # must exist. This .env is CI-local and git-ignored; secrets.env is
        # runtime-only and empty here.
        run: |
          printf '%s\n' \
            "FLINK_IMAGE=$FLINK_IMAGE" \
            "FLUSS_IMAGE=$FLUSS_IMAGE" \
            "OPENOBSERVE_IMAGE=$OPENOBSERVE_IMAGE" \
            "R2_BUCKET=$R2_BUCKET" \
            "R2_ENDPOINT=$R2_ENDPOINT" \
            "S3_WAREHOUSE_PATH=$S3_WAREHOUSE_PATH" \
            > code/01_platform/01_docker/.env
          : > code/01_platform/01_docker/secrets.env

      - name: Build the two runtime images
        # fetch-jars.sh downloads every jar from Maven Central, verifies its
        # SHA256 pin before the build and re-verifies it after.
        run: |
          make flink-image
          make fluss-image

      - name: Build the eight service images
        run: make images

      - name: Publish to GHCR and record the digests
        run: |
          # GHCR requires a lowercase repository path, and github.repository_owner
          # keeps the account's display casing (Saurabh17111994). Docker refuses
          # such a reference outright — measured: rc=1, "repository name
          # (Saurabh17111994/...) must be lowercase" — and the values written into
          # the deploy env are pulled by the VMs, so they must be lowercase too.
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          bash code/01_platform/04_scripts/image-publish.sh \
            --registry "https://ghcr.io/$owner" \
            --env-registry "ghcr.io/$owner" \
            --tag prod \
            --write-env code/01_platform/01_docker/images.published.env

      - name: Stamp the fragment with its source commit
        run: |
          sed -i '/^# source-commit:/d' code/01_platform/01_docker/images.published.env
          sed -i "1a # source-commit: ${GITHUB_SHA:0:12} (run ${GITHUB_RUN_ID})" \
            code/01_platform/01_docker/images.published.env
          grep -n 'source-commit' code/01_platform/01_docker/images.published.env

      - name: Show the fragment
        run: cat code/01_platform/01_docker/images.published.env

      - name: Commit the fragment
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- code/01_platform/01_docker/images.published.env; then
            echo "fragment unchanged — nothing to commit"
            exit 0
          fi
          git add code/01_platform/01_docker/images.published.env
          git commit -m "chore(images): record the published digests [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
